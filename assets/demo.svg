<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">personagent reply decision</title>
  <desc id="desc">A calm macOS-style terminal window shows personagent reading context and structured model output, then choosing either to send a natural reply or remain silent with PASS.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#f2f2f4"/>
    </linearGradient>
    <filter id="window-shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1d1d1f" flood-opacity=".12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d1d1f" flood-opacity=".05"/>
    </filter>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      dominant-baseline: middle;
      text-rendering: geometricPrecision;
    }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .primary { fill: #1d1d1f; }
    .secondary { fill: #6e6e73; }
    .tertiary { fill: #707075; }
    .green { fill: #1f7a36; }
    .blue { fill: #0071e3; }
    .label { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; }
    .scene-reply { opacity: 1; animation: reply-scene 16s ease-in-out infinite; }
    .scene-pass { opacity: 0; animation: pass-scene 16s ease-in-out infinite; }
    .reply-user, .reply-context, .reply-code-1, .reply-code-2,
    .reply-code-3, .reply-code-4, .reply-decision, .reply-result,
    .pass-user, .pass-context, .pass-code-1, .pass-code-2,
    .pass-code-3, .pass-code-4, .pass-decision, .pass-result {
      animation-duration: 16s;
      animation-timing-function: cubic-bezier(.2,.7,.2,1);
      animation-iteration-count: infinite;
    }
    .reply-user { animation-name: reply-user; }
    .reply-context { animation-name: reply-context; }
    .reply-code-1 { animation-name: reply-code-1; }
    .reply-code-2 { animation-name: reply-code-2; }
    .reply-code-3 { animation-name: reply-code-3; }
    .reply-code-4 { animation-name: reply-code-4; }
    .reply-decision { animation-name: reply-decision; }
    .reply-result { animation-name: reply-result; }
    .pass-user { animation-name: pass-user; }
    .pass-context { animation-name: pass-context; }
    .pass-code-1 { animation-name: pass-code-1; }
    .pass-code-2 { animation-name: pass-code-2; }
    .pass-code-3 { animation-name: pass-code-3; }
    .pass-code-4 { animation-name: pass-code-4; }
    .pass-decision { animation-name: pass-decision; }
    .pass-result { animation-name: pass-result; }

    @keyframes reply-scene { 0%,47%{opacity:1} 51%,100%{opacity:0} }
    @keyframes pass-scene { 0%,49%{opacity:0} 53%,96%{opacity:1} 100%{opacity:0} }
    @keyframes reply-user { 0%{opacity:0;transform:translateY(5px)} 5%,47%{opacity:1;transform:none} 51%,100%{opacity:0} }
    @keyframes reply-context { 0%,7%{opacity:0;transform:translateY(5px)} 12%,47%{opacity:1;transform:none} 51%,100%{opacity:0} }
    @keyframes reply-code-1 { 0%,13%{opacity:0;transform:translateY(4px)} 17%,47%{opacity:1;transform:none} 51%,100%{opacity:0} }
    @keyframes reply-code-2 { 0%,16%{opacity:0;transform:translateY(4px)} 20%,47%{opacity:1;transform:none} 51%,100%{opacity:0} }
    @keyframes reply-code-3 { 0%,19%{opacity:0;transform:translateY(4px)} 23%,47%{opacity:1;transform:none} 51%,100%{opacity:0} }
    @keyframes reply-code-4 { 0%,22%{opacity:0;transform:translateY(4px)} 26%,47%{opacity:1;transform:none} 51%,100%{opacity:0} }
    @keyframes reply-decision { 0%,25%{opacity:0;transform:translateY(5px)} 30%,47%{opacity:1;transform:none} 51%,100%{opacity:0} }
    @keyframes reply-result { 0%,30%{opacity:0;transform:translateY(6px)} 36%,47%{opacity:1;transform:none} 51%,100%{opacity:0} }
    @keyframes pass-user { 0%,52%{opacity:0;transform:translateY(5px)} 57%,96%{opacity:1;transform:none} 100%{opacity:0} }
    @keyframes pass-context { 0%,57%{opacity:0;transform:translateY(5px)} 62%,96%{opacity:1;transform:none} 100%{opacity:0} }
    @keyframes pass-code-1 { 0%,62%{opacity:0;transform:translateY(4px)} 66%,96%{opacity:1;transform:none} 100%{opacity:0} }
    @keyframes pass-code-2 { 0%,65%{opacity:0;transform:translateY(4px)} 69%,96%{opacity:1;transform:none} 100%{opacity:0} }
    @keyframes pass-code-3 { 0%,68%{opacity:0;transform:translateY(4px)} 72%,96%{opacity:1;transform:none} 100%{opacity:0} }
    @keyframes pass-code-4 { 0%,71%{opacity:0;transform:translateY(4px)} 75%,96%{opacity:1;transform:none} 100%{opacity:0} }
    @keyframes pass-decision { 0%,74%{opacity:0;transform:translateY(5px)} 79%,96%{opacity:1;transform:none} 100%{opacity:0} }
    @keyframes pass-result { 0%,79%{opacity:0;transform:translateY(6px)} 85%,96%{opacity:1;transform:none} 100%{opacity:0} }

    .typing-cursor { animation: cursor 1.1s steps(1,end) infinite; }
    @keyframes cursor { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .static-pass-note { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .scene-reply, .reply-user, .reply-context, .reply-code-1, .reply-code-2,
      .reply-code-3, .reply-code-4, .reply-decision, .reply-result {
        animation: none !important; opacity: 1; transform: none;
      }
      .scene-pass, .typing-cursor { animation: none !important; opacity: 0; }
      .static-pass-note { display: block; }
    }
  </style>

  <rect width="1000" height="500" fill="url(#canvas)"/>

  <g filter="url(#window-shadow)">
    <rect x="42" y="34" width="916" height="430" rx="22" fill="#ffffff"/>
  </g>
  <rect x="42.5" y="34.5" width="915" height="429" rx="21.5" fill="none" stroke="#dedee2"/>

  <path d="M42 91.5H958" stroke="#e5e5e7"/>
  <circle cx="70" cy="63" r="6" fill="#ff5f57"/>
  <circle cx="90" cy="63" r="6" fill="#febc2e"/>
  <circle cx="110" cy="63" r="6" fill="#28c840"/>
  <text x="500" y="63" class="secondary" font-size="12" font-weight="500" text-anchor="middle">personagent</text>
  <rect x="853" y="51" width="77" height="24" rx="12" fill="#f5f5f7"/>
  <circle cx="868" cy="63" r="3" fill="#34c759"/>
  <text x="879" y="63" class="secondary" font-size="10.5">Live trace</text>

  <text x="74" y="122" class="secondary label">INCOMING</text>
  <text x="693" y="122" class="secondary label">DECISION</text>
  <path d="M665 114V432" stroke="#e8e8ed"/>

  <g class="scene-reply">
    <g class="reply-user">
      <rect x="74" y="139" width="555" height="48" rx="14" fill="#f5f5f7"/>
      <text x="94" y="163" class="primary" font-size="14">spent 3 hours on this and ctrl+z'd it into the void</text>
    </g>

    <g class="reply-context">
      <rect x="74" y="201" width="102" height="26" rx="13" fill="#f5f5f7"/>
      <text x="125" y="214" class="secondary" font-size="10.5" text-anchor="middle">group chat</text>
      <rect x="184" y="201" width="92" height="26" rx="13" fill="#f5f5f7"/>
      <text x="230" y="214" class="secondary" font-size="10.5" text-anchor="middle">friend</text>
      <rect x="284" y="201" width="108" height="26" rx="13" fill="#f5f5f7"/>
      <text x="338" y="214" class="secondary" font-size="10.5" text-anchor="middle">1 memory</text>
    </g>

    <rect x="74" y="243" width="555" height="143" rx="15" fill="#fafafa" stroke="#e5e5e7"/>
    <text x="94" y="265" class="tertiary label">MODEL OUTPUT</text>
    <text x="94" y="289" class="tertiary mono" font-size="11.5">{</text>
    <g class="reply-code-1">
      <text x="109" y="307" class="tertiary mono" font-size="11.5">&quot;reasoning&quot;:</text>
      <text x="198" y="307" class="primary mono" font-size="11.5">&quot;empathy before advice&quot;,</text>
    </g>
    <g class="reply-code-2">
      <text x="109" y="327" class="tertiary mono" font-size="11.5">&quot;intent&quot;:</text>
      <text x="198" y="327" class="blue mono" font-size="11.5">&quot;vent&quot;,</text>
    </g>
    <g class="reply-code-3">
      <text x="109" y="347" class="tertiary mono" font-size="11.5">&quot;reply&quot;:</text>
      <text x="198" y="347" class="green mono" font-size="11.5">&quot;rip. take five before you go back in&quot;,</text>
    </g>
    <g class="reply-code-4">
      <text x="109" y="367" class="tertiary mono" font-size="11.5">&quot;mem&quot;:</text>
      <text x="198" y="367" class="primary mono" font-size="11.5">&quot;&quot;</text>
    </g>
    <text x="94" y="376" class="tertiary mono" font-size="11.5">}</text>

    <g class="reply-result">
      <rect x="74" y="401" width="555" height="40" rx="12" fill="#eef8f0"/>
      <circle cx="94" cy="421" r="4" fill="#34c759"/>
      <text x="108" y="421" class="green" font-size="12.5" font-weight="500">rip. take five before you go back in</text>
      <text x="607" y="421" class="green mono typing-cursor" font-size="12" text-anchor="end">▌</text>
    </g>

    <g class="reply-decision">
      <circle cx="808" cy="215" r="44" fill="#eef8f0"/>
      <path d="M789 215l12 12 27-29" fill="none" stroke="#34c759" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="808" y="282" class="primary" font-size="26" font-weight="650" text-anchor="middle">Reply</text>
      <text x="808" y="312" class="secondary" font-size="12" text-anchor="middle">A response adds value.</text>
      <rect x="748" y="339" width="120" height="32" rx="16" fill="#1f7a36"/>
      <text x="808" y="355" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Channel open</text>
    </g>
  </g>

  <g class="scene-pass">
    <g class="pass-user">
      <rect x="74" y="139" width="555" height="48" rx="14" fill="#f5f5f7"/>
      <text x="94" y="163" class="primary" font-size="14">D . e</text>
    </g>

    <g class="pass-context">
      <rect x="74" y="201" width="102" height="26" rx="13" fill="#f5f5f7"/>
      <text x="125" y="214" class="secondary" font-size="10.5" text-anchor="middle">group chat</text>
      <rect x="184" y="201" width="106" height="26" rx="13" fill="#f5f5f7"/>
      <text x="237" y="214" class="secondary" font-size="10.5" text-anchor="middle">low signal</text>
      <rect x="298" y="201" width="118" height="26" rx="13" fill="#f5f5f7"/>
      <text x="357" y="214" class="secondary" font-size="10.5" text-anchor="middle">no reply needed</text>
    </g>

    <rect x="74" y="243" width="555" height="143" rx="15" fill="#fafafa" stroke="#e5e5e7"/>
    <text x="94" y="265" class="tertiary label">MODEL OUTPUT</text>
    <text x="94" y="289" class="tertiary mono" font-size="11.5">{</text>
    <g class="pass-code-1">
      <text x="109" y="307" class="tertiary mono" font-size="11.5">&quot;reasoning&quot;:</text>
      <text x="198" y="307" class="primary mono" font-size="11.5">&quot;nothing here asks for a reply&quot;,</text>
    </g>
    <g class="pass-code-2">
      <text x="109" y="327" class="tertiary mono" font-size="11.5">&quot;intent&quot;:</text>
      <text x="198" y="327" class="blue mono" font-size="11.5">&quot;chat&quot;,</text>
    </g>
    <g class="pass-code-3">
      <text x="109" y="347" class="tertiary mono" font-size="11.5">&quot;reply&quot;:</text>
      <text x="198" y="347" class="primary mono" font-size="11.5">&quot;PASS&quot;,</text>
    </g>
    <g class="pass-code-4">
      <text x="109" y="367" class="tertiary mono" font-size="11.5">&quot;mem&quot;:</text>
      <text x="198" y="367" class="primary mono" font-size="11.5">&quot;&quot;</text>
    </g>
    <text x="94" y="376" class="tertiary mono" font-size="11.5">}</text>

    <g class="pass-result">
      <rect x="74" y="401" width="555" height="40" rx="12" fill="#f5f5f7"/>
      <circle cx="94" cy="421" r="4" fill="#86868b"/>
      <text x="108" y="421" class="secondary" font-size="12.5" font-weight="500">No message sent</text>
    </g>

    <g class="pass-decision">
      <circle cx="808" cy="215" r="44" fill="#f5f5f7"/>
      <path d="M791 215h34" fill="none" stroke="#86868b" stroke-width="4" stroke-linecap="round"/>
      <text x="808" y="282" class="primary" font-size="26" font-weight="650" text-anchor="middle">Pass</text>
      <text x="808" y="312" class="secondary" font-size="12" text-anchor="middle">Silence is the response.</text>
      <rect x="748" y="339" width="120" height="32" rx="16" fill="#f5f5f7" stroke="#d2d2d7"/>
      <text x="808" y="355" class="secondary" font-size="11.5" font-weight="600" text-anchor="middle">Channel closed</text>
    </g>
  </g>

  <g class="static-pass-note">
    <rect x="714" y="397" width="188" height="34" rx="17" fill="#f5f5f7"/>
    <circle cx="735" cy="414" r="3.5" fill="#86868b"/>
    <text x="748" y="414" class="secondary" font-size="10.5">Also: Pass · Channel closed</text>
  </g>
</svg>
