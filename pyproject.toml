[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personagent"
version = "1.3.0"
description = "A character for your group chats that knows when to stay quiet, and learns from being corrected."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Qiankang Wang" }]
keywords = [
    "llm", "agent", "persona", "chatbot", "group-chat", "astrbot", "onebot",
    "prompt-engineering", "self-evolution", "few-shot", "rag",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.128,<1",
    # A floor here keeps the resolver off the pydantic 1.x line.
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    # Direct, not transitive: ingestion.py's SSRF guard imports httpcore._backends.auto.
    "httpcore>=1.0,<2",
    # Decodes the first frame of a GIF for vision endpoints that reject GIFs.
    "Pillow>=10.4,<13",
    # The no-key web search backend (DuckDuckGo).
    "ddgs>=9,<10",
    # Discord's and QQ's gateways for the platforms personagent connects itself.
    "websockets>=13,<16",
    # Draws the WeChat login QR code for the local page (with Pillow, above).
    "qrcode>=7.4,<9",
    # Unseals the bot secret QQ's scan-to-bind flow returns (AES-GCM).
    "cryptography>=44,<52",
]

[project.optional-dependencies]
# Only for `evolution_benchmark.py --judge anthropic`, which scores with another vendor.
judge = ["anthropic>=0.103,<1"]
# What CI installs on top of the runtime dependencies.
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
personagent = "persona_agent.cli:main"

[project.urls]
Homepage = "https://github.com/wangkant/personagent"
Issues = "https://github.com/wangkant/personagent/issues"
Changelog = "https://github.com/wangkant/personagent/blob/main/CHANGELOG.md"

# The checkout's shared files ship inside the package as persona_agent/_bundled,
# where home.resource() finds them in an installed copy.
[tool.hatch.build.targets.sdist]
# The version PyPI took for 1.2.1; hatchling defaults to a newer one.
core-metadata-version = "2.4"
only-include = ["persona_agent", "data", ".env.example",
                "integrations/astrbot/astrbot_plugin_personagent"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
only-include = ["persona_agent", "data", "integrations/astrbot/astrbot_plugin_personagent"]
# An editable install imports the checkout itself, which reads these files in place.
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.sources]
"data" = "persona_agent/_bundled/data"
"integrations/astrbot/astrbot_plugin_personagent" = "persona_agent/_bundled/integrations/astrbot/astrbot_plugin_personagent"

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "persona_agent/_bundled/.env.example"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites import the checkout, and the tools under tools/.
pythonpath = [".", "tools"]
