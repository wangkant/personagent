[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "personagent"
version = "1.0.0"
description = "A character for your group chats that knows when to stay quiet, and learns from being corrected."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Qiankang Wang" }]
keywords = [
    "llm", "agent", "persona", "chatbot", "group-chat", "astrbot", "onebot",
    "prompt-engineering", "self-evolution", "few-shot", "rag",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# requirements.txt is the one dependency list; a checkout installs it directly.
dynamic = ["dependencies"]

[project.optional-dependencies]
# Only for tools/prompt_lab.py and `evolution_benchmark.py --judge anthropic`, which score with another vendor.
judge = ["anthropic>=0.103,<1"]
# What CI installs on top of the runtime dependencies.
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
personagent = "persona_agent.cli:main"

[project.urls]
Homepage = "https://github.com/wangkant/personagent"
Issues = "https://github.com/wangkant/personagent/issues"
Changelog = "https://github.com/wangkant/personagent/blob/main/CHANGELOG.md"

# setup.py ships data/, .env.example and the AstrBot plugin as persona_agent/_bundled.
[tool.setuptools.packages.find]
include = ["persona_agent", "persona_agent.*"]
exclude = ["*.__pycache__"]
namespaces = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
persona_agent = ["py.typed", "static/**/*"]
