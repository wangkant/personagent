<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="self-title self-desc">
  <title id="self-title">Two-signal self-evolution loop</title>
  <desc id="self-desc">Real user reactions are the primary learning signal and async self-evaluation is the fallback. Corrections become BAD to OK preference pairs, positive reactions and top scores become proven examples, and both stores hot-reload into few-shot retrieval for the next similar conversation.</desc>
  <style>
    svg {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --line-strong: #98a2b3;
      --mint: #087f5b;
      --mint-soft: #eaf8f2;
      --violet: #7047b8;
      --violet-soft: #f3effb;
      --coral: #b5472f;
      --coral-soft: #fdf0ec;
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      dominant-baseline: middle;
    }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); }
    .frame, .rule { fill: none; stroke: var(--line); }
    .flow { fill: none; stroke: var(--line-strong); stroke-width: 1.25; }
    .mint-flow { fill: none; stroke: var(--mint); stroke-width: 1.5; }
    .violet-flow { fill: none; stroke: var(--violet); stroke-width: 1.5; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .mint { fill: var(--mint); }
    .violet { fill: var(--violet); }
    .coral { fill: var(--coral); }
    .mint-region { fill: var(--mint-soft); }
    .violet-region { fill: var(--violet-soft); }
    .coral-region { fill: var(--coral-soft); }
    .code { fill: var(--surface); stroke: var(--line); }
    .headline { font-size: 20px; font-weight: 650; letter-spacing: -0.35px; }
    .eyebrow { font-size: 10.5px; font-weight: 650; letter-spacing: 1.2px; }
    .label { font-size: 12.5px; font-weight: 650; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --surface: #111821;
        --ink: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --line-strong: #59636e;
        --mint: #56d49b;
        --mint-soft: #10241d;
        --violet: #bc8cff;
        --violet-soft: #1c1726;
        --coral: #ff8b73;
        --coral-soft: #2a1714;
      }
    }
  </style>
  <defs>
    <marker id="self-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="500" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="879" height="499" rx="11.5"/>

  <text class="eyebrow violet" x="40" y="32">SYSTEM / LEARNING LOOP</text>
  <text class="headline ink" x="40" y="61">Two signals, one hot-reloaded memory</text>
  <text class="small muted" x="40" y="86">Observed reactions lead; self-evaluation fills the gaps.</text>
  <line class="rule" x1="40" y1="106" x2="840" y2="106"/>

  <rect class="mint-region" x="160" y="126" width="500" height="130" rx="8"/>
  <text class="eyebrow mint" x="180" y="145">01 / PRIMARY SIGNAL</text>
  <text class="label ink" x="180" y="170">directed user reaction</text>
  <text class="small muted" x="180" y="191">quote · @mention · DM reply</text>
  <path class="mint-flow" d="M336 175H390" marker-end="url(#self-arrow)"/>
  <text class="small mint" x="366" y="158" text-anchor="middle">adjudicate</text>
  <text class="tiny muted" x="416" y="145">banter / trolling filtered</text>
  <circle cx="406" cy="176" r="4" class="mint"/>
  <path class="mint-flow" d="M410 176H456V160H482" marker-end="url(#self-arrow)"/>
  <path class="mint-flow" d="M410 176H456V208H482" marker-end="url(#self-arrow)"/>
  <text class="small ink" x="490" y="160">correction</text>
  <text class="tiny coral" x="490" y="177">BAD → OK pair</text>
  <text class="small ink" x="490" y="208">positive reaction</text>
  <text class="tiny mint" x="490" y="225">proven reply</text>
  <path class="mint-flow" d="M590 160H624V178H692" marker-end="url(#self-arrow)"/>
  <path class="mint-flow" d="M590 208H624V196H692" marker-end="url(#self-arrow)"/>
  <text class="tiny muted" x="180" y="238">all verdicts → candidates.jsonl audit</text>

  <rect class="violet-region" x="160" y="276" width="500" height="116" rx="8"/>
  <text class="eyebrow violet" x="180" y="295">02 / FALLBACK SIGNAL</text>
  <text class="label ink" x="180" y="320">async self-eval</text>
  <text class="small muted" x="180" y="341">1–5 + reason → eval.jsonl</text>
  <path class="violet-flow" d="M325 325H378" marker-end="url(#self-arrow)"/>
  <circle cx="394" cy="325" r="4" class="violet"/>
  <path class="violet-flow" d="M398 325H448V308H482" marker-end="url(#self-arrow)"/>
  <path class="violet-flow" d="M398 325H448V354H482" marker-end="url(#self-arrow)"/>
  <text class="small mint" x="490" y="308">score 5 → proven reply</text>
  <text class="small coral" x="490" y="354">score ≤ 2 → diagnose</text>
  <text class="tiny muted" x="490" y="371">EVOLVE_AUTO or review --apply</text>
  <path class="violet-flow" d="M604 308H632V196H692" marker-end="url(#self-arrow)"/>
  <path class="violet-flow" d="M604 354H648V178H692" marker-end="url(#self-arrow)"/>

  <rect class="surface" x="692" y="132" width="148" height="230" rx="8"/>
  <rect class="frame" x="692.5" y="132.5" width="147" height="229" rx="7.5"/>
  <text class="eyebrow violet" x="710" y="151">FEW-SHOT MEMORY</text>
  <rect class="code" x="710" y="170" width="112" height="50" rx="5"/>
  <circle class="coral" cx="722" cy="184" r="3"/>
  <text class="tiny muted" x="732" y="184">feedback.*.jsonl</text>
  <text class="tiny coral" x="722" y="204">BAD / OK pairs</text>
  <rect class="code" x="710" y="230" width="112" height="50" rx="5"/>
  <circle class="mint" cx="722" cy="244" r="3"/>
  <text class="tiny muted" x="732" y="244">examples.*.jsonl</text>
  <text class="tiny mint" x="722" y="264">proven replies</text>
  <line class="rule" x1="710" y1="294" x2="822" y2="294"/>
  <text class="label mint" x="710" y="314">hot reload</text>
  <text class="tiny muted" x="710" y="334">relevance + recency</text>
  <text class="tiny muted" x="710" y="349">no restart</text>

  <rect class="surface" x="40" y="172" width="94" height="66" rx="7"/>
  <rect class="frame" x="40.5" y="172.5" width="93" height="65" rx="6.5"/>
  <text class="eyebrow violet" x="55" y="188">OUTPUT</text>
  <text class="label ink" x="55" y="209">reply sent</text>
  <text class="tiny muted" x="55" y="225">persona pipeline</text>
  <path class="flow" d="M134 205H160" marker-end="url(#self-arrow)"/>
  <path class="flow" d="M134 205C146 205 146 334 160 334" marker-end="url(#self-arrow)"/>

  <path class="mint-flow" d="M766 362V430H98V241" marker-end="url(#self-arrow)"/>
  <rect class="mint-region" x="330" y="414" width="250" height="32" rx="16"/>
  <text class="label mint" x="455" y="431" text-anchor="middle">next similar conversation</text>

  <line class="rule" x1="40" y1="468" x2="840" y2="468"/>
  <text class="tiny muted" x="40" y="483">SIDE LOOP</text>
  <text class="tiny coral" x="112" y="483">sticker sustained low average → persona_fit=false</text>
</svg>
