<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="self-title self-desc">
  <title id="self-title">Two-signal self-evolution loop</title>
  <desc id="self-desc">Real user reactions are the primary learning signal and async self-evaluation is the fallback. Corrections become BAD to OK preference pairs. Positive reactions and score-5 self-evaluations add candidate evidence; two owner reactions, three other-user reactions, or four self-evaluations are required before a reply becomes a proven example.</desc>
  <style>
    svg {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --line-strong: #98a2b3;
      --mint: #087f5b;
      --mint-soft: #eaf8f2;
      --violet: #7047b8;
      --violet-soft: #f3effb;
      --coral: #b5472f;
      --coral-soft: #fdf0ec;
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      dominant-baseline: middle;
    }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); }
    .frame, .rule { fill: none; stroke: var(--line); }
    .flow { fill: none; stroke: var(--line-strong); stroke-width: 1.25; }
    .mint-flow { fill: none; stroke: var(--mint); stroke-width: 1.5; }
    .violet-flow { fill: none; stroke: var(--violet); stroke-width: 1.5; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .mint { fill: var(--mint); }
    .violet { fill: var(--violet); }
    .coral { fill: var(--coral); }
    .mint-region { fill: var(--mint-soft); }
    .violet-region { fill: var(--violet-soft); }
    .coral-region { fill: var(--coral-soft); }
    .code { fill: var(--surface); stroke: var(--line); }
    .headline { font-size: 20px; font-weight: 650; letter-spacing: -0.35px; }
    .eyebrow { font-size: 10.5px; font-weight: 650; letter-spacing: 1.2px; }
    .label { font-size: 12.5px; font-weight: 650; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --surface: #111821;
        --ink: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --line-strong: #59636e;
        --mint: #56d49b;
        --mint-soft: #10241d;
        --violet: #bc8cff;
        --violet-soft: #1c1726;
        --coral: #ff8b73;
        --coral-soft: #2a1714;
      }
    }
  </style>
  <defs>
    <marker id="self-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="600" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="879" height="599" rx="11.5"/>

  <text class="eyebrow violet" x="40" y="32">SYSTEM / LEARNING LOOP</text>
  <text class="headline ink" x="40" y="61">Two signals, one hot-reloaded memory</text>
  <text class="small muted" x="40" y="86">Observed reactions lead; self-evaluation fills the gaps.</text>
  <line class="rule" x1="40" y1="106" x2="840" y2="106"/>

  <rect class="mint-region" x="150" y="126" width="430" height="150" rx="8"/>
  <text class="eyebrow mint" x="170" y="145">01 / PRIMARY SIGNAL</text>
  <text class="label ink" x="170" y="170">directed user reaction</text>
  <text class="small muted" x="170" y="191">quote · @mention · DM reply</text>
  <path class="mint-flow" d="M326 175H376" marker-end="url(#self-arrow)"/>
  <text class="small mint" x="351" y="158" text-anchor="middle">adjudicate</text>
  <text class="tiny muted" x="404" y="145">banter / trolling filtered</text>
  <circle cx="392" cy="176" r="4" class="mint"/>
  <path class="mint-flow" d="M396 176H420V170H430" marker-end="url(#self-arrow)"/>
  <path class="mint-flow" d="M396 176H420V222H430" marker-end="url(#self-arrow)"/>
  <text class="small ink" x="438" y="170">correction</text>
  <text class="tiny coral" x="438" y="188">BAD → OK pair</text>
  <text class="small ink" x="438" y="222">positive reaction</text>
  <text class="tiny mint" x="438" y="240">adds candidate evidence</text>
  <path class="mint-flow" d="M544 170H710V199H720" marker-end="url(#self-arrow)"/>
  <path class="mint-flow" d="M548 222H595" marker-end="url(#self-arrow)"/>
  <text class="tiny muted" x="170" y="260">all verdicts → candidates.jsonl audit</text>

  <rect class="violet-region" x="150" y="296" width="430" height="190" rx="8"/>
  <text class="eyebrow violet" x="170" y="315">02 / FALLBACK SIGNAL</text>
  <text class="label ink" x="170" y="340">async self-eval</text>
  <text class="small muted" x="170" y="361">1–5 + reason → eval.jsonl</text>
  <path class="violet-flow" d="M315 345H376" marker-end="url(#self-arrow)"/>
  <circle cx="392" cy="345" r="4" class="violet"/>
  <path class="violet-flow" d="M396 345H420V326H430" marker-end="url(#self-arrow)"/>
  <path class="violet-flow" d="M396 345H408V424H420" marker-end="url(#self-arrow)"/>
  <text class="small mint" x="438" y="326">score 5</text>
  <text class="tiny mint" x="438" y="344">adds candidate evidence</text>
  <path class="violet-flow" d="M550 326H580V314H595" marker-end="url(#self-arrow)"/>
  <rect class="coral-region" x="420" y="374" width="145" height="106" rx="6"/>
  <text class="eyebrow coral" x="430" y="390">FAILURE REVIEW</text>
  <text class="tiny coral" x="430" y="409">manual · default ≤ 3</text>
  <text class="tiny muted" x="430" y="425">python tools/</text>
  <text class="tiny muted" x="430" y="441">auto_reviewer.py --apply</text>
  <text class="tiny coral" x="430" y="458">unattended · default ≤ 2</text>
  <text class="tiny muted" x="430" y="473">EVOLVE_AUTO=true</text>
  <path class="violet-flow" d="M565 425H711V213H720" marker-end="url(#self-arrow)"/>

  <rect class="surface" x="595" y="188" width="112" height="162" rx="8"/>
  <rect class="frame" x="595.5" y="188.5" width="111" height="161" rx="7.5"/>
  <text class="eyebrow violet" x="605" y="205">EVIDENCE GATE</text>
  <text class="label ink" x="605" y="227">candidate pool</text>
  <line class="rule" x1="605" y1="244" x2="697" y2="244"/>
  <text class="tiny muted" x="605" y="260">2 owner reactions</text>
  <text class="tiny muted" x="605" y="278">3 other-user</text>
  <text class="tiny muted" x="605" y="293">reactions</text>
  <text class="tiny muted" x="605" y="310">4 self-evaluations</text>
  <text class="label mint" x="605" y="332">corroborate</text>
  <path class="mint-flow" d="M707 281H720" marker-end="url(#self-arrow)"/>

  <rect class="surface" x="720" y="132" width="120" height="310" rx="8"/>
  <rect class="frame" x="720.5" y="132.5" width="119" height="309" rx="7.5"/>
  <text class="eyebrow violet" x="730" y="151">FEW-SHOT MEMORY</text>
  <rect class="code" x="730" y="170" width="100" height="60" rx="5"/>
  <circle class="coral" cx="740" cy="185" r="3"/>
  <text class="tiny muted" x="749" y="185">feedback.*</text>
  <text class="tiny muted" x="749" y="201">.jsonl</text>
  <text class="tiny coral" x="740" y="216">BAD / OK pairs</text>
  <rect class="code" x="730" y="250" width="100" height="62" rx="5"/>
  <circle class="mint" cx="740" cy="266" r="3"/>
  <text class="tiny muted" x="749" y="266">examples.*</text>
  <text class="tiny muted" x="749" y="282">.jsonl</text>
  <text class="tiny mint" x="740" y="298">proven replies</text>
  <line class="rule" x1="730" y1="332" x2="830" y2="332"/>
  <text class="label mint" x="730" y="352">hot reload</text>
  <text class="tiny muted" x="730" y="373">relevance + recency</text>
  <text class="tiny muted" x="730" y="389">no restart</text>

  <rect class="surface" x="40" y="182" width="90" height="68" rx="7"/>
  <rect class="frame" x="40.5" y="182.5" width="89" height="67" rx="6.5"/>
  <text class="eyebrow violet" x="54" y="198">OUTPUT</text>
  <text class="label ink" x="54" y="219">reply sent</text>
  <text class="tiny muted" x="54" y="236">persona pipeline</text>
  <path class="flow" d="M130 215H150" marker-end="url(#self-arrow)"/>
  <path class="flow" d="M130 215C140 215 140 393 150 393" marker-end="url(#self-arrow)"/>

  <path class="mint-flow" d="M780 442V525H95V253" marker-end="url(#self-arrow)"/>
  <rect class="mint-region" x="330" y="509" width="250" height="32" rx="16"/>
  <text class="label mint" x="455" y="526" text-anchor="middle">next similar conversation</text>

  <line class="rule" x1="40" y1="565" x2="840" y2="565"/>
  <text class="tiny muted" x="40" y="582">SIDE LOOP</text>
  <text class="tiny coral" x="112" y="582">sticker sustained low average → persona_fit=false</text>
</svg>
