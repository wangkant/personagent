<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="self-title self-desc">
  <title id="self-title">证据驱动的自进化闭环</title>
  <desc id="self-desc">真实用户反应是主要学习信号，异步自评是兜底。每个信号都被记为只追加的证据，并可能提出一个带版本的候选；候选在被晋升之前不会改变任何行为。晋升要求至少两条互不相同、彼此兼容的证据，其中至少一条是强证据，且没有相互矛盾的证据。只有被晋升的候选会物化进检索读取的 few-shot 视图；回滚或取代可以再把这份影响收回，同时不擦除历史。</desc>
  <style>
    svg {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --line-strong: #98a2b3;
      --mint: #087f5b;
      --mint-soft: #eaf8f2;
      --violet: #7047b8;
      --violet-soft: #f3effb;
      --coral: #b5472f;
      --coral-soft: #fdf0ec;
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace;
      dominant-baseline: middle;
    }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); }
    .frame, .rule { fill: none; stroke: var(--line); }
    .flow { fill: none; stroke: var(--line-strong); stroke-width: 1.25; }
    .mint-flow { fill: none; stroke: var(--mint); stroke-width: 1.5; }
    .violet-flow { fill: none; stroke: var(--violet); stroke-width: 1.5; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .mint { fill: var(--mint); }
    .violet { fill: var(--violet); }
    .coral { fill: var(--coral); }
    .mint-region { fill: var(--mint-soft); }
    .violet-region { fill: var(--violet-soft); }
    .coral-region { fill: var(--coral-soft); }
    .code { fill: var(--surface); stroke: var(--line); }
    .headline { font-size: 20px; font-weight: 650; letter-spacing: -0.35px; }
    .eyebrow { font-size: 10.5px; font-weight: 650; letter-spacing: 1.2px; }
    .label { font-size: 12.5px; font-weight: 650; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --surface: #111821;
        --ink: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --line-strong: #59636e;
        --mint: #56d49b;
        --mint-soft: #10241d;
        --violet: #bc8cff;
        --violet-soft: #1c1726;
        --coral: #ff8b73;
        --coral-soft: #2a1714;
      }
    }
  </style>
  <defs>
    <marker id="self-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="600" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="879" height="599" rx="11.5"/>

  <text class="eyebrow violet" x="40" y="32">系统 / 学习闭环</text>
  <text class="headline ink" x="40" y="61">证据进来，晋升出去</text>
  <text class="small muted" x="40" y="86">反应只是证据。只有被晋升的候选才会改变回复。</text>
  <line class="rule" x1="40" y1="106" x2="840" y2="106"/>

  <rect class="mint-region" x="150" y="126" width="430" height="150" rx="8"/>
  <text class="eyebrow mint" x="170" y="145">01 / 主要信号</text>
  <text class="label ink" x="170" y="170">定向用户反应</text>
  <text class="small muted" x="170" y="191">引用 · @提及 · 私聊回复</text>
  <path class="mint-flow" d="M326 175H376" marker-end="url(#self-arrow)"/>
  <text class="small mint" x="351" y="158" text-anchor="middle">裁决</text>
  <text class="tiny muted" x="404" y="145">过滤玩笑与恶意教学</text>
  <circle cx="392" cy="176" r="4" class="mint"/>
  <path class="mint-flow" d="M396 176H420V170H430" marker-end="url(#self-arrow)"/>
  <path class="mint-flow" d="M396 176H420V222H430" marker-end="url(#self-arrow)"/>
  <text class="small ink" x="438" y="170">纠正</text>
  <text class="tiny coral" x="438" y="188">强证据 · BAD → OK</text>
  <text class="small ink" x="438" y="222">正向反应</text>
  <text class="tiny mint" x="438" y="240">只算弱证据</text>
  <path class="mint-flow" d="M552 170H572V208H595" marker-end="url(#self-arrow)"/>
  <path class="mint-flow" d="M552 222H595" marker-end="url(#self-arrow)"/>
  <text class="tiny muted" x="170" y="260">每个反应 → evidence.*.jsonl（只追加）</text>

  <rect class="violet-region" x="150" y="296" width="430" height="190" rx="8"/>
  <text class="eyebrow violet" x="170" y="315">02 / 兜底信号</text>
  <text class="label ink" x="170" y="340">异步自评</text>
  <text class="small muted" x="170" y="361">1–5 分 + 原因 → eval.jsonl</text>
  <path class="violet-flow" d="M315 345H376" marker-end="url(#self-arrow)"/>
  <circle cx="392" cy="345" r="4" class="violet"/>
  <path class="violet-flow" d="M396 345H420V326H430" marker-end="url(#self-arrow)"/>
  <path class="violet-flow" d="M396 345H408V424H420" marker-end="url(#self-arrow)"/>
  <text class="small mint" x="438" y="326">5 分</text>
  <text class="tiny mint" x="438" y="344">只算弱证据</text>
  <path class="violet-flow" d="M550 326H580V314H595" marker-end="url(#self-arrow)"/>
  <rect class="coral-region" x="420" y="374" width="145" height="106" rx="6"/>
  <text class="eyebrow coral" x="430" y="390">失败复盘</text>
  <text class="tiny coral" x="430" y="409">人工 · 默认 ≤ 3 分</text>
  <text class="tiny muted" x="430" y="425">python tools/</text>
  <text class="tiny muted" x="430" y="441">auto_reviewer.py --apply</text>
  <text class="tiny coral" x="430" y="458">无人值守 · 默认 ≤ 2 分</text>
  <text class="tiny muted" x="430" y="473">EVOLVE_AUTO → 候选</text>
  <path class="violet-flow" d="M565 425H578V340H595" marker-end="url(#self-arrow)"/>

  <rect class="surface" x="595" y="188" width="112" height="162" rx="8"/>
  <rect class="frame" x="595.5" y="188.5" width="111" height="161" rx="7.5"/>
  <text class="eyebrow violet" x="605" y="205">晋升闸门</text>
  <text class="label ink" x="605" y="227">候选账本</text>
  <line class="rule" x1="605" y1="244" x2="697" y2="244"/>
  <text class="tiny muted" x="605" y="260">2 条以上证据</text>
  <text class="tiny muted" x="605" y="278">至少 1 条强</text>
  <text class="tiny muted" x="605" y="296">同一作用域</text>
  <text class="tiny muted" x="605" y="314">无矛盾证据</text>
  <text class="label mint" x="605" y="334">晋升</text>
  <path class="mint-flow" d="M707 281H720" marker-end="url(#self-arrow)"/>
  <text class="tiny coral" x="595" y="466">回滚 / 取代</text>
  <text class="tiny muted" x="595" y="481">再把影响收回</text>

  <rect class="surface" x="720" y="132" width="120" height="310" rx="8"/>
  <rect class="frame" x="720.5" y="132.5" width="119" height="309" rx="7.5"/>
  <text class="eyebrow violet" x="730" y="151">FEW-SHOT 记忆</text>
  <rect class="code" x="730" y="170" width="100" height="60" rx="5"/>
  <circle class="coral" cx="740" cy="185" r="3"/>
  <text class="tiny muted" x="749" y="185">promoted.</text>
  <text class="tiny muted" x="749" y="201">feedback.*</text>
  <text class="tiny coral" x="740" y="216">BAD / OK 偏好对</text>
  <rect class="code" x="730" y="250" width="100" height="62" rx="5"/>
  <circle class="mint" cx="740" cy="266" r="3"/>
  <text class="tiny muted" x="749" y="266">promoted.</text>
  <text class="tiny muted" x="749" y="282">examples.*</text>
  <text class="tiny mint" x="740" y="298">已验证回复</text>
  <line class="rule" x1="730" y1="332" x2="830" y2="332"/>
  <text class="label mint" x="730" y="352">热重载</text>
  <text class="tiny muted" x="730" y="373">相关度 + 时近度</text>
  <text class="tiny muted" x="730" y="389">无需重启</text>
  <text class="tiny muted" x="730" y="411">与种子和你</text>
  <text class="tiny muted" x="730" y="427">自己的行同读</text>

  <rect class="surface" x="40" y="182" width="90" height="68" rx="7"/>
  <rect class="frame" x="40.5" y="182.5" width="89" height="67" rx="6.5"/>
  <text class="eyebrow violet" x="54" y="198">输出</text>
  <text class="label ink" x="54" y="219">回复已发送</text>
  <text class="tiny muted" x="54" y="236">persona 管线</text>
  <path class="flow" d="M130 215H150" marker-end="url(#self-arrow)"/>
  <path class="flow" d="M130 215C140 215 140 393 150 393" marker-end="url(#self-arrow)"/>

  <path class="mint-flow" d="M780 442V525H95V253" marker-end="url(#self-arrow)"/>
  <rect class="mint-region" x="330" y="509" width="250" height="32" rx="16"/>
  <text class="label mint" x="455" y="526" text-anchor="middle">下一次相似对话</text>

  <line class="rule" x1="40" y1="565" x2="840" y2="565"/>
  <text class="tiny muted" x="40" y="582">旁路</text>
  <text class="tiny coral" x="112" y="582">贴纸持续低均分 → persona_fit=false</text>
</svg>
