<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="436" viewBox="0 0 1040 436" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">personagent 架构</title>
  <desc id="arch-desc">群聊消息经 AstrBot 进入。personagent 先判断要不要开口，不开口就什么都不发；开口则用人设、按会话的记忆和示例组装提示词，调用模型，校验后把回复发回。另一边，大家的反应经判定后写入只追加的证据日志；只有通过晋升的候选才会成为提示词可用的示例，你也可以批准、驳回或撤销。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4683F"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#557A59"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E8378"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, 'Segoe UI', sans-serif; }
    .t { font-size: 16px; font-weight: 600; fill: #2B2622; }
    .s { font-size: 13px; fill: #71675E; }
    .a { font-size: 12.5px; }
    .band { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; }
  </style>
  <rect x="0.75" y="0.75" width="1038.5" height="434.5" rx="16" fill="#FBF8F2" stroke="#E8DFD0" stroke-width="1.5"/>
  <rect x="12" y="46" width="1016" height="150" rx="14" fill="#F7ECE3"/>
  <rect x="12" y="296" width="1016" height="124" rx="14" fill="#EAF1E6"/>
  <text x="1010" y="186" text-anchor="end" class="band" fill="#C4683F">回复 · 每条消息</text>
  <text x="1010" y="316" text-anchor="end" class="band" fill="#557A59">学习 · 在回复路径之外</text>
  <rect x="33" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="108.0" y="91.0" text-anchor="middle" class="t">群聊</text><text x="108.0" y="110.0" text-anchor="middle" class="s">经 AstrBot</text>
  <rect x="239" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="314.0" y="91.0" text-anchor="middle" class="t">判断</text><text x="314.0" y="110.0" text-anchor="middle" class="s">开口还是安静</text>
  <rect x="445" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="520.0" y="91.0" text-anchor="middle" class="t">组装提示词</text><text x="520.0" y="110.0" text-anchor="middle" class="s">人设 + 上下文</text>
  <rect x="651" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="726.0" y="91.0" text-anchor="middle" class="t">模型</text><text x="726.0" y="110.0" text-anchor="middle" class="s">OpenAI 兼容接口</text>
  <rect x="857" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="932.0" y="91.0" text-anchor="middle" class="t">校验</text><text x="932.0" y="110.0" text-anchor="middle" class="s">过滤、字符策略</text>
  <polyline points="185,94.0 236,94.0" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="211.0" y="86.0" text-anchor="middle" class="a" fill="#C4683F">消息</text>
  <polyline points="391,94.0 442,94.0" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="417.0" y="86.0" text-anchor="middle" class="a" fill="#C4683F">开口</text>
  <polyline points="597,94.0 648,94.0" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="623.0" y="86.0" text-anchor="middle" class="a" fill="#C4683F">提示词</text>
  <polyline points="803,94.0 854,94.0" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="829.0" y="86.0" text-anchor="middle" class="a" fill="#C4683F">回复</text>
  <polyline points="932,62 932,30 108,30 108,60" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="402.0" y="18" width="236" height="22" fill="#FBF8F2"/>
  <text x="520.0" y="34" text-anchor="middle" class="a" fill="#C4683F">回复经 AstrBot 发回群里</text>
  <polyline points="314,126 314,147" fill="none" stroke="#8E8378" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
  <rect x="239.0" y="150" width="150" height="28" rx="14" fill="none" stroke="#8E8378" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="314" y="169" text-anchor="middle" class="s">PASS · 什么都不发</text>
  <rect x="452.0" y="208" width="136" height="54" rx="12" fill="#FFFDF8" stroke="#E2D7C8" stroke-width="1.5"/><text x="520.0" y="232.0" text-anchor="middle" class="t">示例</text><text x="520.0" y="251.0" text-anchor="middle" class="s">内置 + 已晋升</text>
  <rect x="658.0" y="208" width="136" height="54" rx="12" fill="#FFFDF8" stroke="#E2D7C8" stroke-width="1.5"/><text x="726.0" y="232.0" text-anchor="middle" class="t">记忆</text><text x="726.0" y="251.0" text-anchor="middle" class="s">按会话隔离</text>
  <polyline points="490,206 490,128" fill="none" stroke="#8E8378" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="482" y="172" text-anchor="end" class="a" fill="#71675E">示例</text>
  <polyline points="686,206 686,164 560,164 560,128" fill="none" stroke="#8E8378" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="623.0" y="157" text-anchor="middle" class="a" fill="#71675E">笔记</text>
  <polyline points="766,126 766,204" fill="none" stroke="#8E8378" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="774" y="172" text-anchor="start" class="a" fill="#71675E">写入</text>
  <rect x="33" y="330" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="108.0" y="357.0" text-anchor="middle" class="t">反应</text><text x="108.0" y="376.0" text-anchor="middle" class="s">引用、@、叫名字</text>
  <rect x="239" y="330" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="314.0" y="357.0" text-anchor="middle" class="t">证据日志</text><text x="314.0" y="376.0" text-anchor="middle" class="s">只追加，不改写</text>
  <rect x="445" y="330" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="520.0" y="357.0" text-anchor="middle" class="t">晋升</text><text x="520.0" y="376.0" text-anchor="middle" class="s">2 条证据，1 条强</text>
  <rect x="857" y="330" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="932.0" y="357.0" text-anchor="middle" class="t">你</text><text x="932.0" y="376.0" text-anchor="middle" class="s">管理工具</text>
  <polyline points="108,126 108,326" fill="none" stroke="#557A59" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#al)"/>
  <text x="116" y="246" text-anchor="start" class="a" fill="#557A59">有人回应</text>
  <polyline points="185,360.0 236,360.0" fill="none" stroke="#557A59" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#al)"/>
  <text x="211.0" y="352.0" text-anchor="middle" class="a" fill="#557A59">判定</text>
  <polyline points="391,360.0 442,360.0" fill="none" stroke="#557A59" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#al)"/>
  <text x="417.0" y="352.0" text-anchor="middle" class="a" fill="#557A59">候选</text>
  <polyline points="520,328 520,266" fill="none" stroke="#557A59" stroke-width="3" stroke-linejoin="round" marker-end="url(#al)"/>
  <text x="530" y="290" text-anchor="start" class="a" fill="#557A59" font-weight="600">只有晋升的才进入</text>
  <polyline points="855,360.0 598,360.0" fill="none" stroke="#557A59" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#al)"/>
  <text x="726.0" y="352.0" text-anchor="middle" class="a" fill="#557A59">批准 · 驳回 · 撤销</text>
</svg>
