<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">persona-llm-agent：消息路径与学习闭环</title>
  <desc id="architecture-desc">聊天平台（QQ 经 NapCat 接入）统一经 AstrBot 转发插件 POST 到 /webhook/gateway，进入同一个 FastAPI 进程。每条事件依次经过接入、决策、Prompt 组装、生成与校验，最后投递回复或以 PASS 保持沉默。热路径之外，用户反应与评估被追加到证据日志，转化为惰性候选，只有晋升策略批准的部分才会物化并热加载进 Prompt 组装。</desc>
  <style>
    svg {
      --bg: #f8fafc; --surface: #ffffff; --ink: #172033; --muted: #667085;
      --line: #d9e2ec; --line-strong: #98a2b3;
      --blue: #1769aa; --blue-soft: #eaf3fb; --mint: #087f5b; --mint-soft: #eaf8f2;
      --violet: #7047b8; --violet-soft: #f3effb; --coral: #b5472f; --coral-soft: #fdf0ec;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; dominant-baseline: middle; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); stroke: var(--line); }
    .surface-dashed { fill: var(--surface); stroke: var(--line-strong); stroke-dasharray: 4 3; }
    .frame { fill: none; stroke: var(--line); }
    .flow { fill: none; stroke: var(--line-strong); stroke-width: 1.4; }
    .flow-dashed { fill: none; stroke: var(--line-strong); stroke-width: 1.4; stroke-dasharray: 4 3; }
    .flow-mint { fill: none; stroke: var(--mint); stroke-width: 1.6; }
    .flow-coral { fill: none; stroke: var(--coral); stroke-width: 1.4; }
    .violet-region { fill: var(--violet-soft); stroke: none; }
    .mint-region { fill: var(--mint-soft); stroke: none; }
    .stage { fill: var(--surface); stroke: var(--line); }
    .ink { fill: var(--ink); } .muted { fill: var(--muted); } .blue { fill: var(--blue); }
    .mint { fill: var(--mint); } .violet { fill: var(--violet); } .coral { fill: var(--coral); }
    .headline { font-size: 21px; font-weight: 650; letter-spacing: -0.3px; }
    .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; }
    .label { font-size: 13px; font-weight: 650; }
    .small { font-size: 11px; } .tiny { font-size: 10px; }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --surface: #111821; --ink: #e6edf3; --muted: #8b949e;
        --line: #30363d; --line-strong: #59636e;
        --blue: #58a6ff; --blue-soft: #101f30; --mint: #56d49b; --mint-soft: #10241d;
        --violet: #bc8cff; --violet-soft: #1c1726; --coral: #ff8b73; --coral-soft: #2a1714;
      }
    }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="720" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="999" height="719" rx="11.5"/>
  <text class="eyebrow violet" x="40" y="34">架构</text>
  <text class="headline ink" x="40" y="62">一条消息边界，一道学习门</text>
  <text class="small muted" x="40" y="88">所有平台走同一条管线；学到的任何东西在晋升批准前都进不了 Prompt。</text>
  <line class="frame" x1="40" y1="108" x2="960" y2="108"/>
  <rect class="surface" x="40" y="128" width="225" height="64" rx="8"/><text class="label ink" x="54" y="146">聊天平台</text><text class="small muted" x="54" y="166">QQ · Telegram · Discord · Slack · 飞书 · KOOK</text><text class="small muted" x="54" y="183"></text>
  <path class="flow" d="M265 160H292" marker-end="url(#arch-arrow)"/>
  <rect class="surface" x="292" y="128" width="230" height="64" rx="8"/><text class="label ink" x="306" y="146">AstrBot + 转发插件</text><text class="small muted" x="306" y="166">QQ 经 NapCat · 白名单 · HMAC 信封</text><text class="small muted" x="306" y="183"></text>
  <rect class="violet-region" x="40" y="224" width="560" height="430" rx="12"/>
  <text class="eyebrow violet" x="60" y="244">personagent · 单个 FastAPI 进程</text>
  <rect class="mint-region" x="650" y="224" width="310" height="430" rx="12"/>
  <text class="eyebrow mint" x="670" y="244">学习 · 热路径之外，位于 runtime/</text>
  <path class="flow" d="M407 192V262" marker-end="url(#arch-arrow)"/>
  <text class="tiny mono ink" x="415" y="214">POST /webhook/gateway</text>
  <rect class="stage" x="150" y="262" width="430" height="62" rx="8"/><text class="label blue" x="164" y="280">接入</text><text class="small muted" x="164" y="300">token / HMAC · 重放防护 · 并发准入 · 去重</text><text class="small muted" x="164" y="317">归一化 · 补充图片、链接、分享卡片上下文</text>
  <path class="flow" d="M210 324V342" marker-end="url(#arch-arrow)"/>
  <text class="tiny muted" x="218" y="333">事件</text>
  <rect class="stage" x="150" y="342" width="430" height="62" rx="8"/><text class="label blue" x="164" y="360">决策</text><text class="small muted" x="164" y="380">关系与模式：主人 · 被点名 · 追问 · 判定 · 主动</text><text class="small muted" x="164" y="397">合并消息突发 · 回复，或 PASS</text>
  <path class="flow" d="M210 404V422" marker-end="url(#arch-arrow)"/>
  <text class="tiny muted" x="218" y="413">回复？</text>
  <rect class="stage" x="150" y="422" width="430" height="62" rx="8"/><text class="label blue" x="164" y="440">组装 Prompt</text><text class="small muted" x="164" y="460">人设 + [style] · 世界书 · 作用域记忆</text><text class="small muted" x="164" y="477">few-shot：种子 + 已晋升的样例与配对</text>
  <path class="flow" d="M210 484V502" marker-end="url(#arch-arrow)"/>
  <text class="tiny muted" x="218" y="493">上下文</text>
  <rect class="stage" x="150" y="502" width="430" height="62" rx="8"/><text class="label blue" x="164" y="520">生成</text><text class="small muted" x="164" y="540">OpenAI 兼容 /v1 · 结构化 JSON</text><text class="small muted mono" x="164" y="557">{ "reasoning", "intent", "reply", "mem" }</text>
  <path class="flow" d="M210 564V582" marker-end="url(#arch-arrow)"/>
  <text class="tiny muted" x="218" y="573">JSON</text>
  <rect class="stage" x="150" y="582" width="430" height="62" rx="8"/><text class="label blue" x="164" y="600">校验与投递</text><text class="small muted" x="164" y="620">输出过滤 · 字符策略 · 分段 · 表情包</text><text class="small muted" x="164" y="637">格式错误即拒绝 · PASS 不发任何消息</text>
  <path class="flow-dashed" d="M150 533H120V355H150" marker-end="url(#arch-arrow)"/>
  <text class="tiny mono muted" x="126" y="444" transform="rotate(-90 126 444)" text-anchor="middle">"mem" → runtime/memory.json</text>
  <path class="flow-coral" d="M150 615H70V192" marker-end="url(#arch-arrow)"/>
  <text class="tiny coral" x="60" y="666">回复随 HTTP 响应返回</text>
  <rect class="stage" x="690" y="262" width="250" height="62" rx="8"/><text class="label mint" x="704" y="280">已晋升视图</text><text class="small muted mono" x="704" y="300">runtime/promoted.*.&lt;lang&gt;.jsonl</text><text class="small muted" x="704" y="317">原子重写 · 可由账本重建</text>
  <path class="flow-mint" d="M750 342V324" marker-end="url(#arch-arrow)"/>
  <text class="tiny mint" x="758" y="333">物化</text>
  <rect class="stage" x="690" y="342" width="250" height="62" rx="8"/><text class="label mint" x="704" y="360">晋升</text><text class="small muted" x="704" y="380">≥ 2 条兼容事件，≥ 1 条强信号</text><text class="small muted" x="704" y="397">作用域一致 · 回滚与取代保留历史</text>
  <path class="flow-mint" d="M750 422V404" marker-end="url(#arch-arrow)"/>
  <text class="tiny mint" x="758" y="413">裁决</text>
  <rect class="stage" x="690" y="422" width="250" height="62" rx="8"/><text class="label mint" x="704" y="440">候选</text><text class="small muted" x="704" y="460">带版本的提案 · 晋升前保持惰性</text><text class="small muted" x="704" y="477">runtime/candidates.jsonl，只追加</text>
  <path class="flow-mint" d="M750 502V484" marker-end="url(#arch-arrow)"/>
  <text class="tiny mint" x="758" y="493">提案</text>
  <rect class="stage" x="690" y="502" width="250" height="62" rx="8"/><text class="label mint" x="704" y="520">证据日志</text><text class="small muted" x="704" y="540">只追加 · 本身不改变行为</text><text class="small muted" x="704" y="557">作用域：人设、版本、语言、会话、模式</text>
  <path class="flow-mint" d="M750 582V564" marker-end="url(#arch-arrow)"/>
  <text class="tiny mint" x="758" y="573">追加</text>
  <rect class="stage" x="690" y="582" width="250" height="62" rx="8"/><text class="label mint" x="704" y="600">信号</text><text class="small muted" x="704" y="620">定向反应 · 被接受的重试</text><text class="small muted" x="704" y="637">自评 · 进化诊断（均需手动开启）</text>
  <path class="flow-mint" d="M580 613H690" marker-end="url(#arch-arrow)"/>
  <text class="tiny mint" x="635" y="600" text-anchor="middle">回复 + 反应</text>
  <path class="flow-mint" d="M690 293H625V453H580" marker-end="url(#arch-arrow)"/>
  <text class="tiny mint" x="612" y="373" transform="rotate(-90 612 373)" text-anchor="middle">热加载，无需重启</text>
  <line class="frame" x1="40" y1="676" x2="960" y2="676"/>
  <circle class="mint" cx="48" cy="696" r="3"/>
  <text class="small muted" x="60" y="696">可变状态统一位于 runtime/；只追加的账本是唯一事实来源，因此每次晋升都可审计、可回滚。</text>
</svg>
