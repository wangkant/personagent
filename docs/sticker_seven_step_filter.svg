<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="sticker-title sticker-desc">
  <title id="sticker-title">Seven-stage sticker library funnel</title>
  <desc id="sticker-desc">Raw non-bot images narrow through text tagging, persona fit, visual aesthetics, evaluation feedback, tag selection, orphan removal, and startup purging before an in-character sticker can reach selection.</desc>
  <style>
    svg {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --line-strong: #98a2b3;
      --mint: #087f5b;
      --mint-soft: #eaf8f2;
      --violet: #7047b8;
      --violet-soft: #f3effb;
      --coral: #b5472f;
      --coral-soft: #fdf0ec;
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Microsoft YaHei", "PingFang SC", monospace;
      dominant-baseline: middle;
    }
    .bg { fill: var(--bg); }
    .frame, .rule { fill: none; stroke: var(--line); }
    .flow { fill: none; stroke: var(--line-strong); stroke-width: 1.25; }
    .violet-stage { fill: var(--violet-soft); stroke: var(--line); }
    .mint-stage { fill: var(--mint-soft); stroke: var(--line); }
    .coral-stage { fill: var(--coral-soft); stroke: var(--line); }
    .result { fill: var(--surface); stroke: var(--mint); }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .mint { fill: var(--mint); }
    .violet { fill: var(--violet); }
    .coral { fill: var(--coral); }
    .headline { font-size: 20px; font-weight: 650; letter-spacing: -0.35px; }
    .eyebrow { font-size: 10.5px; font-weight: 650; letter-spacing: 1.2px; }
    .label { font-size: 12.5px; font-weight: 650; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --surface: #111821;
        --ink: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --line-strong: #59636e;
        --mint: #56d49b;
        --mint-soft: #10241d;
        --violet: #bc8cff;
        --violet-soft: #1c1726;
        --coral: #ff8b73;
        --coral-soft: #2a1714;
      }
    }
  </style>

  <rect class="bg" width="880" height="500" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="879" height="499" rx="11.5"/>

  <text class="eyebrow violet" x="40" y="32">STICKERS / EVIDENCE FUNNEL</text>
  <text class="headline ink" x="40" y="61">Seven checks before a sticker can speak</text>
  <text class="small muted" x="40" y="86">Every stage removes weak, off-persona, or missing candidates.</text>
  <line class="rule" x1="40" y1="106" x2="840" y2="106"/>

  <text class="eyebrow muted" x="100" y="120">RAW NON-BOT IMAGES</text>
  <text class="tiny muted" x="580" y="120" text-anchor="end">MD5 DEDUPED</text>

  <path class="violet-stage" d="M100 132H580L558 168H122Z"/>
  <text class="label violet" x="340" y="150" text-anchor="middle">01 / text tagging</text>
  <path class="flow" d="M558 150H610"/>
  <circle class="violet" cx="610" cy="150" r="2.5"/>
  <text class="small ink" x="624" y="150">reads chat context, never pixels</text>

  <path class="violet-stage" d="M124 172H556L534 208H146Z"/>
  <text class="label violet" x="340" y="190" text-anchor="middle">02 / persona-fit text gate</text>
  <path class="flow" d="M534 190H610"/>
  <circle class="violet" cx="610" cy="190" r="2.5"/>
  <text class="small ink" x="624" y="190">inferred emotion matches persona</text>

  <path class="violet-stage" d="M148 212H532L510 248H170Z"/>
  <text class="label violet" x="340" y="230" text-anchor="middle">03 / visual aesthetic gate</text>
  <path class="flow" d="M510 230H610"/>
  <circle class="violet" cx="610" cy="230" r="2.5"/>
  <text class="small ink" x="624" y="230">vision model judges the pixels</text>

  <path class="mint-stage" d="M172 252H508L486 288H194Z"/>
  <text class="label mint" x="340" y="270" text-anchor="middle">04 / eval feedback loop</text>
  <path class="flow" d="M486 270H610"/>
  <circle class="mint" cx="610" cy="270" r="2.5"/>
  <text class="small ink" x="624" y="270">sustained low scores demote</text>

  <path class="mint-stage" d="M196 292H484L462 328H218Z"/>
  <text class="label mint" x="340" y="310" text-anchor="middle">05 / tag selection</text>
  <path class="flow" d="M462 310H610"/>
  <circle class="mint" cx="610" cy="310" r="2.5"/>
  <text class="small ink" x="624" y="310">synonyms match + freshness boost</text>

  <path class="mint-stage" d="M220 332H460L438 368H242Z"/>
  <text class="label mint" x="340" y="350" text-anchor="middle">06 / orphan skip</text>
  <path class="flow" d="M438 350H610"/>
  <circle class="mint" cx="610" cy="350" r="2.5"/>
  <text class="small ink" x="624" y="350">missing-file entries are removed</text>

  <path class="coral-stage" d="M244 372H436L414 408H266Z"/>
  <text class="label coral" x="340" y="390" text-anchor="middle">07 / startup purge</text>
  <path class="flow" d="M414 390H610"/>
  <circle class="coral" cx="610" cy="390" r="2.5"/>
  <text class="small ink" x="624" y="390">failed entries are deleted on disk</text>

  <path class="flow" d="M266 408L284 432H396L414 408"/>
  <rect class="result" x="250" y="442" width="180" height="34" rx="17"/>
  <circle class="mint" cx="270" cy="459" r="3"/>
  <text class="label mint" x="286" y="459">in-character selection</text>
  <text class="tiny muted" x="450" y="459">the only sendable pool</text>
</svg>
