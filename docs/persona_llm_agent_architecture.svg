<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="436" viewBox="0 0 1040 436" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">personagent architecture</title>
  <desc id="arch-desc">Messages from group chats arrive through a connector (AstrBot, Satori or Matrix). personagent decides whether to speak; if not, nothing is sent. Otherwise it builds a prompt from the persona, per-conversation memory and examples, calls the model, checks the reply and sends it back. Separately, people's reactions are judged into an append-only evidence log; only candidates that promotion approves become examples the prompt can use, and you can approve, reject or roll them back.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4683F"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#557A59"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E8378"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .t { font-size: 16px; font-weight: 600; fill: #2B2622; }
    .s { font-size: 13px; fill: #71675E; }
    .a { font-size: 12.5px; }
    .band { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; }
  </style>
  <rect x="0.75" y="0.75" width="1038.5" height="434.5" rx="16" fill="#FBF8F2" stroke="#E8DFD0" stroke-width="1.5"/>
  <rect x="12" y="46" width="1016" height="150" rx="14" fill="#F7ECE3"/>
  <rect x="12" y="296" width="1016" height="124" rx="14" fill="#EAF1E6"/>
  <text x="1010" y="186" text-anchor="end" class="band" fill="#C4683F">REPLY · EVERY MESSAGE</text>
  <text x="1010" y="316" text-anchor="end" class="band" fill="#557A59">LEARNING · BESIDE THE REPLY PATH</text>
  <rect x="33" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="108.0" y="91.0" text-anchor="middle" class="t">Group chat</text><text x="108.0" y="110.0" text-anchor="middle" class="s">via a connector</text>
  <rect x="239" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="314.0" y="91.0" text-anchor="middle" class="t">Decide</text><text x="314.0" y="110.0" text-anchor="middle" class="s">speak or stay quiet</text>
  <rect x="445" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="520.0" y="91.0" text-anchor="middle" class="t">Build prompt</text><text x="520.0" y="110.0" text-anchor="middle" class="s">persona + context</text>
  <rect x="651" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="726.0" y="91.0" text-anchor="middle" class="t">Model</text><text x="726.0" y="110.0" text-anchor="middle" class="s">OpenAI-compatible</text>
  <rect x="857" y="64" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="932.0" y="91.0" text-anchor="middle" class="t">Check</text><text x="932.0" y="110.0" text-anchor="middle" class="s">filters, character</text>
  <polyline points="185,94.0 236,94.0" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="211.0" y="86.0" text-anchor="middle" class="a" fill="#C4683F">message</text>
  <polyline points="391,94.0 442,94.0" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="417.0" y="86.0" text-anchor="middle" class="a" fill="#C4683F">speak</text>
  <polyline points="597,94.0 648,94.0" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="623.0" y="86.0" text-anchor="middle" class="a" fill="#C4683F">prompt</text>
  <polyline points="803,94.0 854,94.0" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="829.0" y="86.0" text-anchor="middle" class="a" fill="#C4683F">reply</text>
  <polyline points="932,62 932,30 108,30 108,60" fill="none" stroke="#C4683F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="402.0" y="18" width="236" height="22" fill="#FBF8F2"/>
  <text x="520.0" y="34" text-anchor="middle" class="a" fill="#C4683F">reply, back via the connector</text>
  <polyline points="314,126 314,147" fill="none" stroke="#8E8378" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
  <rect x="239.0" y="150" width="150" height="28" rx="14" fill="none" stroke="#8E8378" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="314" y="169" text-anchor="middle" class="s">PASS · nothing sent</text>
  <rect x="452.0" y="208" width="136" height="54" rx="12" fill="#FFFDF8" stroke="#E2D7C8" stroke-width="1.5"/><text x="520.0" y="232.0" text-anchor="middle" class="t">Examples</text><text x="520.0" y="251.0" text-anchor="middle" class="s">seeds + promoted</text>
  <rect x="658.0" y="208" width="136" height="54" rx="12" fill="#FFFDF8" stroke="#E2D7C8" stroke-width="1.5"/><text x="726.0" y="232.0" text-anchor="middle" class="t">Memory</text><text x="726.0" y="251.0" text-anchor="middle" class="s">per conversation</text>
  <polyline points="490,206 490,128" fill="none" stroke="#8E8378" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="482" y="172" text-anchor="end" class="a" fill="#71675E">examples</text>
  <polyline points="686,206 686,164 560,164 560,128" fill="none" stroke="#8E8378" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="623.0" y="157" text-anchor="middle" class="a" fill="#71675E">notes</text>
  <polyline points="766,126 766,204" fill="none" stroke="#8E8378" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="774" y="172" text-anchor="start" class="a" fill="#71675E">saves</text>
  <rect x="33" y="330" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="108.0" y="357.0" text-anchor="middle" class="t">Reactions</text><text x="108.0" y="376.0" text-anchor="middle" class="s">quotes, @s, names</text>
  <rect x="239" y="330" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="314.0" y="357.0" text-anchor="middle" class="t">Evidence log</text><text x="314.0" y="376.0" text-anchor="middle" class="s">append-only</text>
  <rect x="445" y="330" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="520.0" y="357.0" text-anchor="middle" class="t">Promotion</text><text x="520.0" y="376.0" text-anchor="middle" class="s">2 events, 1 strong</text>
  <rect x="857" y="330" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#E2D7C8" stroke-width="1.5"/><text x="932.0" y="357.0" text-anchor="middle" class="t">You</text><text x="932.0" y="376.0" text-anchor="middle" class="s">the admin tool</text>
  <polyline points="108,126 108,326" fill="none" stroke="#557A59" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#al)"/>
  <text x="116" y="246" text-anchor="start" class="a" fill="#557A59">people react</text>
  <polyline points="185,360.0 236,360.0" fill="none" stroke="#557A59" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#al)"/>
  <text x="211.0" y="352.0" text-anchor="middle" class="a" fill="#557A59">judged</text>
  <polyline points="391,360.0 442,360.0" fill="none" stroke="#557A59" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#al)"/>
  <text x="417.0" y="352.0" text-anchor="middle" class="a" fill="#557A59">candidate</text>
  <polyline points="520,328 520,266" fill="none" stroke="#557A59" stroke-width="3" stroke-linejoin="round" marker-end="url(#al)"/>
  <text x="530" y="290" text-anchor="start" class="a" fill="#557A59" font-weight="600">promoted only</text>
  <polyline points="855,360.0 598,360.0" fill="none" stroke="#557A59" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#al)"/>
  <text x="726.0" y="352.0" text-anchor="middle" class="a" fill="#557A59">approve · reject · roll back</text>
</svg>
