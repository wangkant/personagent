<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">persona-llm-agent message path and learning loop</title>
  <desc id="architecture-desc">QQ through OneBot and other platforms through AstrBot enter one FastAPI agent. Messages move left to right through ingestion, context enrichment, mode selection, JSON generation, validation, and platform routing. Beneath the main path, reactions and asynchronous evaluation are recorded as append-only evidence; only the candidates the promotion policy approves are materialized and hot-reloaded into few-shot retrieval.</desc>
  <style>
    svg {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --line-strong: #98a2b3;
      --blue: #1769aa;
      --blue-soft: #eaf3fb;
      --mint: #087f5b;
      --mint-soft: #eaf8f2;
      --violet: #7047b8;
      --violet-soft: #f3effb;
      --coral: #b5472f;
      --coral-soft: #fdf0ec;
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Microsoft YaHei", "PingFang SC", monospace;
      dominant-baseline: middle;
    }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); }
    .frame, .rule { fill: none; stroke: var(--line); }
    .flow { fill: none; stroke: var(--line-strong); stroke-width: 1.25; }
    .mint-flow { fill: none; stroke: var(--mint); stroke-width: 1.5; }
    .blue-region { fill: var(--blue-soft); }
    .mint-region { fill: var(--mint-soft); }
    .violet-region { fill: var(--violet-soft); }
    .coral-region { fill: var(--coral-soft); }
    .code { fill: var(--surface); stroke: var(--line); }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .blue { fill: var(--blue); }
    .mint { fill: var(--mint); }
    .violet { fill: var(--violet); }
    .coral { fill: var(--coral); }
    .headline { font-size: 20px; font-weight: 650; letter-spacing: -0.35px; }
    .eyebrow { font-size: 10.5px; font-weight: 650; letter-spacing: 1.2px; }
    .label { font-size: 12.5px; font-weight: 650; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --surface: #111821;
        --ink: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --line-strong: #59636e;
        --blue: #58a6ff;
        --blue-soft: #101f30;
        --mint: #56d49b;
        --mint-soft: #10241d;
        --violet: #bc8cff;
        --violet-soft: #1c1726;
        --coral: #ff8b73;
        --coral-soft: #2a1714;
      }
    }
  </style>
  <defs>
    <marker id="architecture-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="520" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="979" height="519" rx="11.5"/>

  <text class="eyebrow violet" x="40" y="32">SYSTEM / MESSAGE PATH</text>
  <text class="headline ink" x="40" y="61">One agent path, any chat platform</text>
  <text class="small muted" x="40" y="86">Transport changes at the edges; persona, safety, and learning stay shared.</text>
  <line class="rule" x1="40" y1="106" x2="940" y2="106"/>

  <rect class="violet-region" x="200" y="126" width="740" height="184" rx="10"/>
  <text class="eyebrow violet" x="220" y="143">SHARED FASTAPI AGENT</text>
  <text class="tiny muted" x="920" y="143" text-anchor="end">ONE PIPELINE / ANY PLATFORM</text>

  <rect class="surface" x="40" y="152" width="126" height="52" rx="7"/>
  <rect class="frame" x="40.5" y="152.5" width="125" height="51" rx="6.5"/>
  <text class="label ink" x="54" y="170">QQ / OneBot</text>
  <text class="tiny muted" x="54" y="189">NapCat · Lagrange</text>

  <rect class="surface" x="40" y="228" width="126" height="52" rx="7"/>
  <rect class="frame" x="40.5" y="228.5" width="125" height="51" rx="6.5"/>
  <text class="label ink" x="54" y="246">other / AstrBot</text>
  <text class="tiny muted" x="54" y="265">Telegram · Discord · …</text>

  <path class="flow" d="M166 178H220" marker-end="url(#architecture-arrow)"/>
  <path class="flow" d="M166 254H220" marker-end="url(#architecture-arrow)"/>

  <rect class="code" x="220" y="152" width="126" height="52" rx="6"/>
  <text class="eyebrow blue" x="234" y="168">DIRECT INGRESS</text>
  <text class="tiny ink" x="234" y="187">/webhook/qq</text>
  <rect class="code" x="220" y="228" width="126" height="52" rx="6"/>
  <text class="eyebrow blue" x="234" y="244">GATEWAY INGRESS</text>
  <text class="tiny ink" x="234" y="263">/webhook/gateway</text>

  <path class="flow" d="M346 178H362V216H380" marker-end="url(#architecture-arrow)"/>
  <path class="flow" d="M346 254H362V216"/>
  <circle class="blue" cx="362" cy="216" r="3"/>

  <rect class="blue-region" x="380" y="160" width="140" height="112" rx="7"/>
  <text class="eyebrow blue" x="394" y="178">PREFLIGHT + CONTEXT</text>
  <text class="small ink" x="394" y="201">dedup · debounce</text>
  <text class="small ink" x="394" y="222">sticky-call</text>
  <line class="rule" x1="394" y1="238" x2="506" y2="238"/>
  <text class="tiny muted" x="394" y="253">vision + URL metadata</text>

  <path class="flow" d="M520 216H550" marker-end="url(#architecture-arrow)"/>
  <rect class="blue-region" x="550" y="160" width="112" height="112" rx="7"/>
  <text class="eyebrow blue" x="564" y="178">MODE</text>
  <text class="label ink" x="564" y="202">decide</text>
  <text class="tiny muted" x="564" y="226">owner · called</text>
  <text class="tiny muted" x="564" y="244">followup · judge</text>

  <path class="flow" d="M662 216H692" marker-end="url(#architecture-arrow)"/>
  <rect class="mint-region" x="692" y="160" width="108" height="112" rx="7"/>
  <text class="eyebrow mint" x="706" y="178">LLM</text>
  <text class="label ink" x="706" y="202">JSON call</text>
  <text class="tiny muted" x="706" y="226">prompt cache</text>
  <text class="tiny muted" x="706" y="244">fail closed</text>

  <path class="flow" d="M800 216H830" marker-end="url(#architecture-arrow)"/>
  <rect class="coral-region" x="830" y="160" width="110" height="112" rx="7"/>
  <text class="eyebrow coral" x="844" y="178">VALIDATE + SEND</text>
  <text class="tiny ink" x="844" y="199">semantic regex</text>
  <text class="tiny ink" x="844" y="215">character whitelist</text>
  <line class="rule" x1="844" y1="230" x2="926" y2="230"/>
  <text class="tiny muted" x="844" y="244">/send_group_msg</text>
  <text class="tiny muted" x="844" y="259">gateway reply</text>

  <rect class="surface" x="200" y="348" width="740" height="122" rx="10"/>
  <rect class="frame" x="200.5" y="348.5" width="739" height="121" rx="9.5"/>
  <text class="eyebrow mint" x="220" y="364">LEARNING LOOP / BENEATH THE MESSAGE PATH</text>

  <rect class="mint-region" x="230" y="376" width="150" height="58" rx="7"/>
  <text class="label mint" x="246" y="395">few-shot retrieval</text>
  <text class="tiny muted" x="246" y="416">relevance + recency</text>

  <rect class="code" x="410" y="376" width="140" height="58" rx="7"/>
  <text class="label ink" x="426" y="395">promotion</text>
  <text class="tiny muted" x="426" y="416">2 events, 1 strong</text>

  <rect class="code" x="590" y="376" width="130" height="58" rx="7"/>
  <text class="label ink" x="606" y="395">evidence</text>
  <text class="tiny muted" x="606" y="416">append-only log</text>

  <rect class="mint-region" x="760" y="376" width="120" height="58" rx="7"/>
  <text class="label mint" x="776" y="395">signals</text>
  <text class="tiny muted" x="776" y="416">reaction + self-eval</text>

  <path class="mint-flow" d="M885 272V348H820V376" marker-end="url(#architecture-arrow)"/>
  <path class="mint-flow" d="M760 405H720" marker-end="url(#architecture-arrow)"/>
  <path class="mint-flow" d="M590 405H550" marker-end="url(#architecture-arrow)"/>
  <path class="mint-flow" d="M410 405H380" marker-end="url(#architecture-arrow)"/>
  <path class="mint-flow" d="M305 376V326H746V272" marker-end="url(#architecture-arrow)"/>
  <text class="tiny mint" x="500" y="326" text-anchor="middle">HOT RELOAD · NO RESTART</text>

  <text class="tiny muted" x="220" y="453">Primary: directed user reactions · fallback: async 1–5 self-evaluation</text>
  <line class="rule" x1="40" y1="490" x2="940" y2="490"/>
  <circle class="mint" cx="48" cy="506" r="3"/>
  <text class="small muted" x="60" y="506">The next similar message inherits only what promotion approved; evidence alone changes nothing.</text>
</svg>
