<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="reload-title reload-desc">
  <title id="reload-title">Compact hot-reload correction cycle</title>
  <desc id="reload-desc">A low score or live observation is traced to its owning prompt block. A hard constraint, counter-example, semantic output-filter rule, or BAD to OK preference pair is added. Language-aware retrieval injects the correction on the next similar input without a restart.</desc>
  <style>
    svg {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --line-strong: #98a2b3;
      --mint: #087f5b;
      --mint-soft: #eaf8f2;
      --violet: #7047b8;
      --violet-soft: #f3effb;
      --coral: #b5472f;
      --coral-soft: #fdf0ec;
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      dominant-baseline: middle;
    }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); }
    .frame, .rule { fill: none; stroke: var(--line); }
    .loop { fill: none; stroke: var(--line-strong); stroke-width: 1.25; }
    .mint-flow { fill: none; stroke: var(--mint); stroke-width: 1.5; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .mint { fill: var(--mint); }
    .violet { fill: var(--violet); }
    .coral { fill: var(--coral); }
    .mint-region { fill: var(--mint-soft); }
    .violet-region { fill: var(--violet-soft); }
    .coral-region { fill: var(--coral-soft); }
    .code { fill: var(--surface); stroke: var(--line); }
    .headline { font-size: 20px; font-weight: 650; letter-spacing: -0.35px; }
    .eyebrow { font-size: 10.5px; font-weight: 650; letter-spacing: 1.2px; }
    .label { font-size: 12.5px; font-weight: 650; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --surface: #111821;
        --ink: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --line-strong: #59636e;
        --mint: #56d49b;
        --mint-soft: #10241d;
        --violet: #bc8cff;
        --violet-soft: #1c1726;
        --coral: #ff8b73;
        --coral-soft: #2a1714;
      }
    }
  </style>
  <defs>
    <marker id="reload-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="420" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="879" height="419" rx="11.5"/>

  <text class="eyebrow violet" x="40" y="32">OPERATIONS / CORRECTION CYCLE</text>
  <text class="headline ink" x="40" y="61">Patch the failure class, reload the next turn</text>
  <text class="small muted" x="40" y="86">The manual path for failures that need human judgment.</text>
  <line class="rule" x1="40" y1="106" x2="840" y2="106"/>

  <path class="loop" d="M88 238C88 157 166 130 250 130H630C724 130 792 167 792 238S724 346 630 346H250C156 346 88 312 88 238" marker-end="url(#reload-arrow)"/>

  <circle class="coral-region" cx="88" cy="238" r="18"/>
  <text class="label coral" x="88" y="239" text-anchor="middle">01</text>
  <text class="label ink" x="40" y="194">observe</text>
  <text class="tiny coral" x="40" y="211">LOW-SCORE</text>
  <text class="tiny muted" x="40" y="278">eval.jsonl</text>
  <text class="tiny muted" x="40" y="293">or live failure</text>

  <circle class="violet-region" cx="250" cy="130" r="18"/>
  <text class="label violet" x="250" y="131" text-anchor="middle">02</text>
  <text class="label ink" x="250" y="155" text-anchor="middle">locate owner</text>
  <text class="tiny muted" x="250" y="171" text-anchor="middle">STYLE_GUIDE · INTENT_RULES</text>

  <circle class="violet-region" cx="630" cy="130" r="18"/>
  <text class="label violet" x="630" y="131" text-anchor="middle">03</text>
  <text class="label ink" x="630" y="155" text-anchor="middle">patch nearby</text>
  <text class="tiny muted" x="630" y="171" text-anchor="middle">constraint · counter-example</text>

  <circle class="coral-region" cx="792" cy="238" r="18"/>
  <text class="label coral" x="792" y="239" text-anchor="middle">04</text>
  <text class="label ink" x="724" y="194">write pair</text>
  <text class="tiny coral" x="724" y="211">BAD / OK</text>
  <text class="tiny muted" x="724" y="278">runtime/</text>
  <text class="tiny muted" x="724" y="293">feedback.*.jsonl</text>

  <circle class="mint-region" cx="630" cy="346" r="18"/>
  <text class="label mint" x="630" y="347" text-anchor="middle">05</text>
  <text class="label ink" x="630" y="306" text-anchor="middle">retrieve</text>
  <text class="tiny muted" x="630" y="322" text-anchor="middle">tokens + tags + recency</text>

  <circle class="mint-region" cx="250" cy="346" r="18"/>
  <path class="mint-flow" d="M238 346H262" marker-end="url(#reload-arrow)"/>
  <text class="label mint" x="250" y="306" text-anchor="middle">next similar input</text>
  <text class="tiny muted" x="250" y="322" text-anchor="middle">pair enters few-shot context</text>

  <rect class="surface" x="278" y="194" width="324" height="92" rx="8"/>
  <rect class="frame" x="278.5" y="194.5" width="323" height="91" rx="7.5"/>
  <text class="eyebrow muted" x="296" y="211">PATCHSET</text>
  <text class="small violet" x="296" y="232">+ hard constraint beside similar rule</text>
  <text class="small violet" x="296" y="250">+ counter-example</text>
  <text class="small mint" x="296" y="268">+ data/output_filter.&lt;lang&gt;.json</text>

  <line class="rule" x1="40" y1="382" x2="840" y2="382"/>
  <text class="eyebrow mint" x="40" y="400">HOT / NO RESTART</text>
  <text class="tiny muted" x="178" y="400">output_filter.&lt;lang&gt;.json</text>
  <text class="tiny muted" x="366" y="400">lorebook.&lt;lang&gt;.json</text>
  <text class="tiny mint" x="540" y="400">dynamic few-shot memory</text>
</svg>
