<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <title>personagent</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%231c1c1a%22 d=%22M8.5 3.5h7a5.5 5.5 0 0 1 5.5 5.5v3a5.5 5.5 0 0 1-5.5 5.5h-4.6l-4.2 3.4a.6.6 0 0 1-1-.47v-3.3A5.5 5.5 0 0 1 3 12V9a5.5 5.5 0 0 1 5.5-5.5z%22/%3E%3Crect x=%228.6%22 y=%228.6%22 width=%222%22 height=%223.4%22 rx=%221%22 fill=%22%23fff%22/%3E%3Crect x=%2213.4%22 y=%228.6%22 width=%222%22 height=%223.4%22 rx=%221%22 fill=%22%23fff%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/welcome.css" />
    <link rel="stylesheet" href="/assets/signin.css" />
    <script src="/assets/signin.js" defer></script>
  </head>
  <body class="signin-body">
    <main class="signin-page" id="signin-page">
      <header class="signin-top">
        <span class="brand"
          ><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.5 3.5h7a5.5 5.5 0 0 1 5.5 5.5v3a5.5 5.5 0 0 1-5.5 5.5h-4.6l-4.2 3.4a.6.6 0 0 1-1-.47v-3.3A5.5 5.5 0 0 1 3 12V9a5.5 5.5 0 0 1 5.5-5.5z"/><rect x="8.6" y="8.6" width="2" height="3.4" rx="1" fill="#fff"/><rect x="13.4" y="8.6" width="2" height="3.4" rx="1" fill="#fff"/></svg></span>personagent</span
        ><select id="signin-language" aria-label="Language" data-t-aria="signin_language">
          <option value="en">English</option>
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt-BR">Português (Brasil)</option>
          <option value="ru">Русский</option>
        </select>
      </header>
      <form id="signin-form" class="signin-form" novalidate>
        <h1 data-t="signin_title">Sign in to personagent</h1>
        <p class="lead" data-t="signin_lead">
          This page manages personagent running on another computer. Enter the page password set there.
        </p>
        <label for="signin-password" data-t="signin_password">Page password</label>
        <div class="key-field">
          <input
            id="signin-password"
            type="password"
            autocomplete="current-password"
            spellcheck="false"
            autocapitalize="off"
            aria-describedby="signin-error"
          /><button type="button" id="signin-show" data-t="signin_show" aria-controls="signin-password">Show</button>
        </div>
        <button type="submit" class="primary full" id="signin-submit" data-t="signin_submit">Sign in</button>
        <div class="error" id="signin-error" role="alert" hidden></div>
        <p class="signin-status" id="signin-status" role="status" hidden></p>
        <p class="field-note" data-t="signin_forgot">
          To set a new password, run personagent page password on the computer personagent runs on.
        </p>
        <p class="field-note signin-warn" id="signin-http" data-t="signin_http" hidden>
          This connection is not encrypted.
        </p>
      </form>
    </main>
  </body>
</html>
