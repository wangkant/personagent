<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>personagent</title>
<link rel="icon" href="dashboard/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="dashboard/app.css">
<script src="dashboard/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="mark" src="dashboard/mark.svg" alt="" width="30" height="30">
    <span class="app">personagent</span>
    <span id="persona-name" class="persona"></span>
    <span id="state-pill" class="pill"></span>
  </div>
  <div class="controls">
    <button id="lang-toggle" type="button" class="ghost"></button>
    <button id="theme-toggle" type="button" class="ghost"></button>
  </div>
</header>
<div id="statusbar" class="statusbar" hidden>
  <details class="status">
    <summary><span id="facts" class="facts"></span><span id="status-more" class="more"></span></summary>
    <div id="overview" class="overview"></div>
  </details>
</div>
<main>
  <div id="hints"></div>
  <section id="welcome" class="welcome" hidden></section>
  <section class="convs">
    <nav class="list-pane" aria-labelledby="conv-title">
      <h2 id="conv-title" class="list-title"></h2>
      <div id="conv-list" class="conv-list"></div>
    </nav>
    <div id="detail" class="detail-pane"></div>
  </section>
</main>
<footer id="footer" class="footer"></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="noscript">This page needs JavaScript. 此页面需要启用 JavaScript。</p></noscript>
</body>
</html>
