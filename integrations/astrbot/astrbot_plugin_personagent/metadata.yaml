name: astrbot_plugin_personagent
display_name: personagent
short_desc: 让 personagent 角色进群：会判断什么时候该闭嘴，被纠正后经得起检验才学会。A group-chat character that knows when to stay quiet and learns from being corrected.
desc: |
  AstrBot 把消息交给 [personagent](https://github.com/wangkant/personagent) 的途径，用于 personagent 自己不直接连接的平台。
  角色只在被叫到、或判断真人会接话时开口；别人纠正它、它的第二次回答被接受后，才把更好的说法记下来，一个捣乱的人教不坏它；
  每个群的记忆分开，学到的东西都有记录、可以撤回。

  这个插件只负责转发，需要另外运行 personagent 服务：先 `python -m pip install personagent`，
  再运行 `personagent connect astrbot`，它会装好本插件并配好口令。

  The way AstrBot hands messages to personagent, for platforms personagent does not connect itself.
  Needs the personagent service: `python -m pip install personagent`, then `personagent connect astrbot`,
  which installs and configures this plugin for you.
version: 1.1.0.dev1
author: Qiankang Wang
repo: https://github.com/wangkant/astrbot_plugin_personagent
astrbot_version: ">=4.25,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - discord
  - slack
  - kook
  - lark
  - dingtalk
  - line
  - wecom
  - wecom_ai_bot
  - weixin_official_account
  - weixin_oc
  - mattermost
  - misskey
  - satori
