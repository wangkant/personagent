name: CI

# Run the offline regression suite on every push / PR to master. The tests
# need no API keys or network (they stub the model and transport), so a plain
# dependency install + one command is enough.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Validate POSIX launcher syntax and executable bit
        run: |
          bash -n start.sh
          test -x start.sh
      - name: Run isolated script suites through pytest
        run: |
          python -m pytest -q
          python -m compileall -q .

  windows:
    # The real suite must run here, not just the launchers. Windows is the
    # platform this is actually deployed on, and it is the only one that
    # executes storage.FileLock's msvcrt branch — the lock every runtime JSONL
    # writer now depends on for not losing records, since Windows O_APPEND is
    # seek-to-end-then-write rather than an atomic append. Until this job ran
    # the suite, that branch was executed by no CI job on any platform.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Run isolated script suites through pytest
        run: |
          python -m pytest -q
          python -m compileall -q .
      - name: Exercise Windows launchers from a foreign working directory
        run: python tests/test_launchers.py

  packaging:
    # The test job runs from a checkout, which hides packaging breakage: a
    # missing py.typed, a module left out of the wheel, or paths.ROOT resolving
    # next to site-packages all still "work" in-tree. This job installs the
    # built artifact somewhere else entirely and imports it from there.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Editable install
        run: |
          python -m pip install "build>=1.2,<2"
          python -m pip install -e .
          python -c "import persona_agent; print('editable', persona_agent.__version__)"
      - name: Build wheel + sdist
        run: python -m build
      - name: Install the wheel into a clean venv and import from outside the checkout
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheelenv/bin/python -c "
          import persona_agent, importlib.metadata as md
          from persona_agent.paths import ROOT
          from persona_agent.agent import Agent
          # Cross-check rather than pin: a hard-coded '0.1.' both red-lights a
          # correct 0.2.0 and green-lights pyproject/__init__ drift, which is
          # the failure actually worth catching.
          dist = md.version('personagent')
          assert persona_agent.__version__ == dist, (persona_agent.__version__, dist)
          # A wheel install has no data/ next to the package: ROOT must fall back
          # to the working directory, never to site-packages.
          assert 'site-packages' not in str(ROOT), ROOT
          import importlib.resources as r
          assert (r.files('persona_agent') / 'py.typed').is_file(), 'py.typed missing from wheel'
          print('wheel import ok; ROOT =', ROOT)
          "
      - name: Install the sdist into a clean venv and import from outside the checkout
        run: |
          python -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/python -m pip install --quiet dist/*.tar.gz
          cd /tmp
          /tmp/sdistenv/bin/python -c "
          import persona_agent, importlib.metadata as md
          from persona_agent.agent import Agent
          dist = md.version('personagent')
          assert persona_agent.__version__ == dist, (persona_agent.__version__, dist)
          print('sdist import ok', persona_agent.__version__)
          "
