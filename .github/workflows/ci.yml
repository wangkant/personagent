name: CI

# The offline regression suite: no API keys or network, the tests stub the model and transport.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Validate POSIX launcher syntax and executable bit
        run: |
          bash -n start.sh
          test -x start.sh
      # Dead and undefined names only, not a style gate; re-exports carry `# noqa: F401`.
      - name: Lint for dead and undefined names
        run: |
          python -m pip install "ruff>=0.6,<1"
          ruff check . --select F401,F811,F821,F841
      - name: Run the test suite
        run: |
          python -m pytest -q
          python -m compileall -q .

  windows:
    # Windows is the main deployment platform and the only one running storage.FileLock's msvcrt branch.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Run the test suite
        run: |
          python -m pytest -q
          python -m compileall -q .

  package:
    # A checkout hides packaging breakage, so the built artifacts are installed and run elsewhere.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the sdist and the wheel, then check their metadata
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<8"
          python -m build
          python -m twine check --strict dist/*
      - name: Editable install
        run: |
          python -m pip install -e .
          python -c "import persona_agent; print('editable', persona_agent.__version__)"
      - name: Install the wheel into a clean venv and import it from outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/wheelenv/Scripts"; else BIN="$RUNNER_TEMP/wheelenv/bin"; fi
          echo "WHEEL_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/python" -c "
          import importlib.metadata as md
          import persona_agent
          from persona_agent import home
          from persona_agent.agent import Agent
          assert persona_agent.__version__ == md.version('personagent'), persona_agent.__version__
          assert not home.is_checkout(), home.CHECKOUT
          for shipped in ('.env.example', 'data/persona.example.en.txt', 'data/evals/speak.en.jsonl',
                          'integrations/astrbot/astrbot_plugin_personagent/metadata.yaml'):
              assert home.resource(*shipped.split('/')).is_file(), shipped
          assert (home.PACKAGE_DIR / 'py.typed').is_file(), 'py.typed missing from the wheel'
          print('wheel import ok', persona_agent.__version__)
          "
      - name: Smoke-test the installed command offline (init, chat, run, doctor)
        run: |
          VERSION=$(python -c "import persona_agent; print(persona_agent.__version__)")
          python tools/package_smoke.py --personagent "$WHEEL_BIN/personagent" --version "$VERSION"
      - name: Install the sdist into a clean venv and import it from outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/sdistenv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/sdistenv/Scripts"; else BIN="$RUNNER_TEMP/sdistenv/bin"; fi
          "$BIN/python" -m pip install --quiet dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$BIN/python" -c "
          from persona_agent import home
          assert home.resource('data', 'persona.example.en.txt').is_file()
          print('sdist install ok')
          "
