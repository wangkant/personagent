name: CI

# The offline regression suite: no API keys or network, the tests stub the model and transport.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # pytest and ruff come from the dev extra, where their versions are written once.
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      # Dead and undefined names only, not a style gate; re-exports carry `# noqa: F401`.
      - name: Lint for dead and undefined names
        run: ruff check . --select F401,F811,F821,F841
      - name: Run the test suite
        run: |
          python -m pytest -q
          python -m compileall -q .

  windows:
    # Windows is the main deployment platform and the only one running storage.FileLock's msvcrt branch.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        run: |
          python -m pytest -q
          python -m compileall -q .

  package:
    # A checkout hides packaging breakage, so the built artifacts are installed and run elsewhere.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the sdist and the wheel, then check their metadata
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<8"
          python -m build
          python -m twine check --strict dist/*
      - name: Check the wheel ships every tracked shared file
        # hatchling skips what .gitignore names, even when it is tracked.
        run: |
          python - <<'EOF'
          import glob, subprocess, zipfile
          prefix = "persona_agent/_bundled/"
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          shipped = {n[len(prefix):] for n in names if n.startswith(prefix)}
          tracked = set(subprocess.run(
              ["git", "ls-files", "data", ".env.example", "integrations/astrbot/astrbot_plugin_personagent"],
              capture_output=True, text=True, check=True).stdout.split())
          assert tracked and tracked <= shipped, sorted(tracked - shipped)
          print(len(tracked), "tracked shared files are in the wheel")
          EOF
      - name: Editable install
        run: |
          python -m pip install -e .
          python -c "import persona_agent; print('editable', persona_agent.__version__)"
      - name: Install the wheel into a clean venv and import it from outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/wheelenv/Scripts"; else BIN="$RUNNER_TEMP/wheelenv/bin"; fi
          echo "WHEEL_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/python" -c "
          import importlib.metadata as md
          import persona_agent
          from persona_agent import home
          from persona_agent.agent import Agent
          assert persona_agent.__version__ == md.version('personagent'), persona_agent.__version__
          assert not home.is_checkout(), home.CHECKOUT
          for shipped in ('.env.example', 'data/persona.example.en.txt', 'data/evals/speak.en.jsonl',
                          'integrations/astrbot/astrbot_plugin_personagent/metadata.yaml'):
              assert home.resource(*shipped.split('/')).is_file(), shipped
          assert (home.PACKAGE_DIR / 'py.typed').is_file(), 'py.typed missing from the wheel'
          print('wheel import ok', persona_agent.__version__)
          "
      - name: Smoke-test the installed command offline (init, chat, run, doctor)
        run: |
          VERSION=$(python -c "import persona_agent; print(persona_agent.__version__)")
          python tools/package_smoke.py --personagent "$WHEEL_BIN/personagent" --version "$VERSION"
          python tools/welcome_smoke.py --personagent "$WHEEL_BIN/personagent"
      - name: Install the sdist into a clean venv and import it from outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/sdistenv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/sdistenv/Scripts"; else BIN="$RUNNER_TEMP/sdistenv/bin"; fi
          "$BIN/python" -m pip install --quiet dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$BIN/python" -c "
          from persona_agent import home
          assert home.resource('data', 'persona.example.en.txt').is_file()
          print('sdist install ok')
          "

  installer:
    # install.sh and install.ps1 as a newcomer runs them: uv and a Python of its own are fetched.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    env:
      # The checkout stands in for the PyPI release.
      PERSONAGENT_PACKAGE: ${{ github.workspace }}
      PERSONAGENT_NO_START: "1"
      PERSONAGENT_NO_MODIFY_PATH: "1"
      PERSONAGENT_MIRROR: "off"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install on macOS or Linux, with no uv on PATH
        if: runner.os != 'Windows'
        run: |
          while command -v uv >/dev/null 2>&1; do
            gone=$(dirname "$(command -v uv)")
            PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -vx "$gone" | paste -sd: -)
          done
          export PERSONAGENT_UV_DIR="$RUNNER_TEMP/uvbin" UV_TOOL_BIN_DIR="$RUNNER_TEMP/bin"
          export PERSONAGENT_SHORTCUT_DIR="$RUNNER_TEMP/launcher"
          mkdir -p "$PERSONAGENT_SHORTCUT_DIR"
          sh install.sh
          test -x "$PERSONAGENT_UV_DIR/uv"
          "$UV_TOOL_BIN_DIR/personagent" --version
          test -n "$(ls "$PERSONAGENT_SHORTCUT_DIR")"
          # Again: an update of what is there, with the uv it fetched.
          sh install.sh
      - name: Install on Linux through the mirrors (manual runs only)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: |
          export PERSONAGENT_MIRROR=cn PERSONAGENT_UV_DIR="$RUNNER_TEMP/uvbin-cn" UV_TOOL_BIN_DIR="$RUNNER_TEMP/bin-cn"
          export UV_TOOL_DIR="$RUNNER_TEMP/tools-cn" UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/python-cn"
          export PERSONAGENT_NO_SHORTCUT=1 PATH="/usr/bin:/bin"
          sh install.sh
          "$UV_TOOL_BIN_DIR/personagent" --version
      - name: Install on Windows, with no uv on PATH
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, which is what `irm | iex` runs in.
        shell: powershell
        run: |
          $found = Get-Command uv -CommandType Application -ErrorAction SilentlyContinue
          if ($found) {
            $gone = Split-Path -Parent $found.Source
            $env:Path = (($env:Path -split ';') | Where-Object { $_ -and $_.TrimEnd('\') -ne $gone.TrimEnd('\') }) -join ';'
          }
          $env:PERSONAGENT_UV_DIR = Join-Path $env:RUNNER_TEMP 'uvbin'
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          $links = 'desktop', 'programs', 'startup' | ForEach-Object { Join-Path $env:RUNNER_TEMP "links\$_" }
          $links | ForEach-Object { $null = New-Item -ItemType Directory -Force -Path $_ }
          $env:PERSONAGENT_SHORTCUT_DIRS = $links -join ';'
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:PERSONAGENT_UV_DIR 'uv.exe'))) { throw 'uv was not fetched' }
          & (Join-Path $env:UV_TOOL_BIN_DIR 'personagent.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $links[0] 'personagent.lnk'))) { throw 'no desktop icon' }
          # The way the README gives it: the script as a string, through iex.
          Get-Content -Raw install.ps1 | Invoke-Expression
          if (-not $PersonagentInstalled) { throw 'the piped install failed' }
