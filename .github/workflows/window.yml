name: Window

# The app window on each system: `personagent start` opens it on a scratch home,
# the page is set up and chats inside it with a stand-in model, then it closes.
on:
  push:
    branches: [main]
    paths:
      - persona_agent/window.py
      - persona_agent/welcome.py
      - persona_agent/services.py
      - persona_agent/panels/**
      - persona_agent/static/**
      - tools/window_smoke.py
      - tools/package_smoke.py
      - pyproject.toml
      - .github/workflows/window.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install a display and what Qt's web engine loads (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libnss3 libasound2t64 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libdbus-1-3
      # The app extra is what gives macOS and Linux the window; Windows has it without.
      - name: Install personagent with its window
        run: python -m pip install -e ".[app]"
      - name: Open the window and use the page in it (Linux)
        if: runner.os == 'Linux'
        env:
          # The runner forbids the user namespaces Chromium's sandbox needs.
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: xvfb-run -a -s "-screen 0 1280x900x24" python tools/window_smoke.py
      - name: Open the window and use the page in it
        if: runner.os != 'Linux'
        run: python tools/window_smoke.py
