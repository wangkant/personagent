name: Bug report
description: "Something does not work: it will not start, will not connect, crashes, or the setup fails"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Check [When the bot goes quiet](https://github.com/wangkant/personagent/blob/main/docs/deploy.md#when-the-bot-goes-quiet) first; most silent bots are one of its ten items.

        If the bot **said the wrong thing**, use the "Persona report" form instead.

        Never paste API keys, tokens or real chat logs. Black out QQ numbers and names.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `personagent --version`.
      placeholder: personagent 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - uvx personagent
        - uv tool install personagent
        - pipx install personagent
        - pip install personagent
        - git clone (quickstart.py)
        - Downloaded ZIP
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Docker
        - Other
    validations:
      required: true
  - type: dropdown
    id: connector
    attributes:
      label: Chat platform and connector
      options:
        - Terminal only (personagent chat)
        - QQ through AstrBot and NapCat
        - Another platform through AstrBot
        - Satori
        - Matrix
        - My own connector
        - The deprecated /v1/onebot route
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
      description: The steps you took, and where it went wrong.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `personagent doctor`
      description: It checks the settings and each upstream service, and sends one tiny request to each model. It hides keys. Check the output before pasting.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The lines from `personagent run` around the problem, and from AstrBot's log (lines starting `personagent:`) if you use it.
      render: shell
